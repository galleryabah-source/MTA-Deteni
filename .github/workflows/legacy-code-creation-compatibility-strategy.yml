name: Legacy Code Creation Compatibility Strategy

on:
  pull_request:
    paths:
      - "docs/LEGACY_DETAINEE_CODE_CREATION_COMPATIBILITY_STRATEGY_V1.md"
      - "test/legacy-code-creation-compatibility-strategy.test.mjs"
      - "web/mta-domain-commands-v1.js"
      - "supabase/functions/mta-api/index.ts"
      - ".github/workflows/legacy-code-creation-compatibility-strategy.yml"

jobs:
  compatibility-strategy:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --test test/legacy-code-creation-compatibility-strategy.test.mjs
