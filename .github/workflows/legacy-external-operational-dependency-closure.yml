name: Legacy External Operational Dependency Closure

on:
  pull_request:
    paths:
      - "docs/LEGACY_EXTERNAL_OPERATIONAL_DEPENDENCY_CLOSURE_V1.md"
      - "test/legacy-external-operational-dependency-closure.test.mjs"
      - ".github/workflows/legacy-external-operational-dependency-closure.yml"

jobs:
  g1-evidence-boundary:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --test test/legacy-external-operational-dependency-closure.test.mjs