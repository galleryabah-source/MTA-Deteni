name: G1-X4 Privileged Credential Surface Audit

on:
  pull_request:
    paths:
      - "docs/G1_X4_PRIVILEGED_CREDENTIAL_SURFACE_AUDIT_V1.md"
      - "test/g1-x4-privileged-credential-surface.test.mjs"
      - ".github/workflows/g1-x4-privileged-credential-surface.yml"

jobs:
  audit-boundary:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --test test/g1-x4-privileged-credential-surface.test.mjs
