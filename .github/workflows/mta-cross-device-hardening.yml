name: MTA DETENI Cross-Device Hardening

on:
  pull_request:
    branches: [main]
    paths:
      - 'web/**'
      - 'tests/**'
      - '.github/workflows/mta-cross-device-hardening.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mta-cross-device-${{ github.ref }}
  cancel-in-progress: true

env:
  MTA_EXECUTION_ENV: controlled-nonprod
  CI: true

jobs:
  cross-device:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - device: phone-portrait
            width: 390
            height: 844
          - device: phone-landscape
            width: 844
            height: 390
          - device: tablet-portrait
            width: 768
            height: 1024
          - device: tablet-landscape
            width: 1024
            height: 768
          - device: desktop
            width: 1440
            height: 900
          - device: desktop-hd
            width: 1920
            height: 1080
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Prepare browser runtime
        run: |
          npm init -y
          npm install --no-save playwright@1.55.0 http-server@14.1.1
          npx playwright install --with-deps chromium
      - name: Start static runtime
        run: npx http-server web -p 4173 > /tmp/mta-http.log 2>&1 &
      - name: Wait for static runtime
        run: |
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:4173/ >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/mta-http.log || true
          exit 1
      - name: Execute cross-device hardening
        env:
          DEVICE: ${{ matrix.device }}
          WIDTH: ${{ matrix.width }}
          HEIGHT: ${{ matrix.height }}
        run: node tests/cross-device-hardening.mjs
      - name: Upload device evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mta-cross-device-${{ matrix.device }}
          path: |
            /tmp/mta-cross-device-${{ matrix.device }}.json
            /tmp/mta-cross-device-summary.json
          if-no-files-found: error
