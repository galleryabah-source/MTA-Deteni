name: MTA DETENI Domain CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  domain-ci:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Static architecture contract gate
        run: node .github/scripts/mta-contract-gate.mjs
      - name: Install dependencies
        run: npm install --include=dev --ignore-scripts --no-audit --no-fund
      - name: Typecheck production source
        run: npm run typecheck
      - name: Typecheck test source
        run: npm run typecheck:test
      - name: JavaScript regression tests
        run: npm test
      - name: TypeScript domain tests
        run: npm run test:unit
      - name: Controlled execution evidence
        run: node .github/scripts/mta-execution-harness.mjs
        env:
          MTA_EXECUTION_ENV: controlled-nonprod
      - name: Upload execution evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mta-execution-evidence-${{ github.run_id }}
          path: artifacts/mta-evidence/
          if-no-files-found: warn
