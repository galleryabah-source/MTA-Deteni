name: MTA DETENI Domain CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mta-domain-ci-${{ github.ref }}
  cancel-in-progress: true

env:
  MTA_EXECUTION_ENV: controlled-nonprod
  CI: true

jobs:
  domain-ci:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Verify repository state
        run: |
          git status --short
          test -f package.json
          test -f .github/scripts/mta-contract-gate.mjs
          test -f .github/scripts/mta-execution-harness.mjs
          test -f .github/scripts/mta-evidence-validator.mjs

      - name: Install dependencies
        run: npm install

      - name: Static architecture contract gate
        run: node .github/scripts/mta-contract-gate.mjs

      - name: Production typecheck
        run: npm run typecheck

      - name: Test typecheck
        run: npm run typecheck:test

      - name: JavaScript regression tests
        run: npm test

      - name: Settings navigation regression tests
        run: node test/settings-navigation-regression.test.mjs

      - name: P9.5 audit integrity contract tests
        run: node test/p9.5-audit-integrity.test.mjs

      - name: Security adversarial boundary certification
        run: npx tsx test/security-adversarial-certification.test.ts

      - name: QR scan verification tests
        run: npx tsx test/qr-scan-result.test.ts

      - name: Browser QR context verification tests
        run: node test/qr-browser-context.test.mjs

      - name: F3 operational actions contract tests
        run: node test/f3-operational-actions.test.mjs

      - name: F3 leave return action contract tests
        run: node test/f3-leave-return.test.mjs

      - name: F4 Daily Guard Report aggregation tests
        run: npx tsx test/f4-daily-guard-report.test.ts

      - name: F4 Daily Guard Report browser contract tests
        run: node test/f4-daily-guard-report-browser.test.mjs

      - name: TypeScript domain tests
        run: npm run test:unit

      - name: Integrated acceptance runtime evidence
        run: npx tsx scripts/mta-integrated-acceptance-runtime.ts

      - name: F5.4 Direct Final Integrity Certification
        run: node scripts/mta-final-integrity-certification.mjs

      - name: Local runtime adapter evidence
        run: npx tsx scripts/mta-local-runtime-adapter-evidence.ts

      - name: Local runtime recovery evidence
        run: npx tsx scripts/mta-local-runtime-recovery-evidence.ts

      - name: Backup and recovery continuity evidence
        run: npx tsx scripts/mta-backup-recovery-continuity-evidence.ts

      - name: Backup Restore Disaster Recovery Certification
        run: npx tsx scripts/mta-backup-restore-dr-certification.ts

      - name: Verify Backup Restore Disaster Recovery certification
        if: always()
        run: |
          test -s artifacts/mta-evidence/backup-restore-dr-certification.json
          node -e "const x=require('./artifacts/mta-evidence/backup-restore-dr-certification.json'); if(x.result!=='PASS'||x.disasterRecoveryCertified!==true||x.backupIntegrityCertified!==true||x.restoreIntegrityCertified!==true||x.rpoCertified!==true||x.rtoCertified!==true) process.exit(1); console.log('BACKUP_RESTORE_DR='+x.result)"
      - name: Upload Backup Restore Disaster Recovery evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mta-backup-restore-dr-${{ github.sha }}
          path: artifacts/mta-evidence/backup-restore-dr-certification.json
          if-no-files-found: error
          retention-days: 14

      - name: Runtime device handoff evidence
        run: npx tsx scripts/mta-runtime-device-handoff-evidence.ts

      - name: Controlled execution evidence harness
        run: node .github/scripts/mta-execution-harness.mjs

      - name: Verify execution evidence
        if: always()
        run: |
          test -s artifacts/mta-evidence/execution.json
          node .github/scripts/mta-evidence-validator.mjs artifacts/mta-evidence/execution.json

      - name: Verify F5.4 certification evidence
        if: always()
        run: |
          test -s artifacts/mta-evidence/f5-final-integrity-certification.json
          node -e "const x=require('./artifacts/mta-evidence/f5-final-integrity-certification.json'); if(x.finalGate?.status!=='PASS'||x.finalGate?.ok!==true) process.exit(1); console.log('FINAL_INTEGRITY='+x.finalGate.status)"

      - name: Upload F5.4 final integrity evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mta-f5-final-integrity-${{ github.sha }}
          path: artifacts/mta-evidence/f5-final-integrity-certification.json
          if-no-files-found: error
          retention-days: 14

      - name: Upload controlled execution evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mta-controlled-execution-evidence-${{ github.sha }}
          path: artifacts/mta-evidence/
          if-no-files-found: error
          retention-days: 14
