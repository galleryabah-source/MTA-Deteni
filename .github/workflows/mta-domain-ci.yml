name: MTA DETENI Domain CI

on:
  push:
    branches: [main, "phase-p12.961-13.200"]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  domain-ci:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Install dependencies
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Typecheck
        run: npm run typecheck
      - name: JavaScript regression tests
        run: npm test
      - name: TypeScript domain tests
        run: npm run test:unit
