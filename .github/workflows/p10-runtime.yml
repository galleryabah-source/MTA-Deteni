name: P10 Runtime Domain

on:
  push:
    branches:
      - phase9-kernel-implementation
      - phase10.10-persistent-grant-boundary
      - phase10.13-approved-db-integration-gate
      - phase10.14-database-verification-package
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  runtime-domain:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      APP_ENV: test
      AI_ENABLED: 'false'
      MIGRATION_FREEZE: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify synthetic-only runtime contract
        run: |
          set -euxo pipefail
          test "$APP_ENV" = test
          test "$AI_ENABLED" = false
          test "$MIGRATION_FREEZE" = true
      - name: Run P10 domain integration suites
        run: |
          set -euxo pipefail
          node --test test/p10.1-runtime-domain-integration.test.mjs test/p10.2-placement-domain-boundary.test.mjs test/p10.3-movement-ledger-headcount.test.mjs test/p10.5-document-lifecycle.test.mjs test/p10.6-template-manifest.test.mjs test/p10.7-docx-renderer.test.mjs test/p10.8-artifact-handoff.test.mjs test/p10.9-artifact-distribution.test.mjs test/p10.10-persistent-grant-contract.test.mjs test/p10.10-persistent-grant-repository.test.mjs test/p10.11-persistent-grant-integration-readiness.test.mjs test/p10.12-database-package-contract.test.mjs test/p10.13-approved-db-integration-gate.test.mjs test/p10.14-database-verification-package.test.mjs test/p10.15-controlled-database-execution-harness.test.mjs test/p10.16-database-role-rls-verification.test.mjs test/p10.19-docx-artifact-contract.test.mjs | tee p10-runtime-test-output.txt
      - name: Upload runtime diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p10-runtime-diagnostics
          path: p10-runtime-test-output.txt
          if-no-files-found: ignore
