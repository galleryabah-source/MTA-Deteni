name: P10 Runtime Domain

on:
  push:
    branches:
      - phase9-kernel-implementation
      - phase10.10-persistent-grant-boundary
      - phase10.13-approved-db-integration-gate
      - phase10.14-database-verification-package
      - phase10.18-document-output-operationalization
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  runtime-domain:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      APP_ENV: test
      AI_ENABLED: 'false'
      MIGRATION_FREEZE: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Verify immutable synthetic safety gate
        run: |
          set -euxo pipefail
          test "$APP_ENV" = test
          test "$AI_ENABLED" = false
          test "$MIGRATION_FREEZE" = true
          test ! -f .env
          test ! -f .env.local
      - name: Verify required regression gate and test files
        run: |
          set -euxo pipefail
          test -f scripts/p10-runtime-regression-gate.mjs
          test -f scripts/p10-evidence-integrity-gate.mjs
          test -f test/p10.21-runtime-integration-contract.test.mjs
          test -f test/p10.19-docx-output-contract.test.mjs
          test -f test/p10.19-docx-artifact-contract.test.mjs
      - name: Run deterministic P10.22 regression gate
        run: node scripts/p10-runtime-regression-gate.mjs
      - name: Verify P10.23 evidence integrity
        if: always()
        run: node scripts/p10-evidence-integrity-gate.mjs
      - name: Upload P10.22/P10.23 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p10-runtime-evidence-${{ github.run_id }}
          path: artifacts/p10-runtime/
          if-no-files-found: error
          retention-days: 14
