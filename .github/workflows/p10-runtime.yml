name: P10 Runtime Domain

on:
  push:
    branches: [phase9-kernel-implementation, phase10.10-persistent-grant-boundary, phase10.13-approved-db-integration-gate, phase10.18-document-output-operationalization]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  runtime-domain:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      APP_ENV: test
      AI_ENABLED: 'false'
      MIGRATION_FREEZE: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Prepare CI transport diagnostic
        if: always()
        run: |
          set -u
          mkdir -p artifacts/p10-runtime
          tracked_lockfile=false
          if git ls-files --error-unmatch package-lock.json >/dev/null 2>&1; then tracked_lockfile=true; fi
          {
            echo "generatedAt=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "commitSha=${GITHUB_SHA}"
            echo "workflowRunId=${GITHUB_RUN_ID}"
            echo "workflowAttempt=${GITHUB_RUN_ATTEMPT}"
            echo "runnerOS=${RUNNER_OS}"
            echo "runnerArch=${RUNNER_ARCH}"
            echo "nodeVersion=$(node --version)"
            echo "npmVersion=$(npm --version)"
            echo "lockfileTracked=${tracked_lockfile}"
            echo "envFilePresent=$([ -f .env ] && echo true || echo false)"
            echo "envLocalFilePresent=$([ -f .env.local ] && echo true || echo false)"
            echo "APP_ENV=${APP_ENV}"
            echo "AI_ENABLED=${AI_ENABLED}"
            echo "MIGRATION_FREEZE=${MIGRATION_FREEZE}"
            echo "gitStatusStart=$(git status --short | tr '\n' ' ' || true)"
          } > artifacts/p10-runtime/ci-transport-diagnostic.txt
      - name: Verify immutable synthetic safety gate
        run: |
          set -euxo pipefail
          test "$APP_ENV" = test
          test "$AI_ENABLED" = false
          test "$MIGRATION_FREEZE" = true
          test ! -f .env
          test ! -f .env.local
      - name: Install approved dependencies
        run: npm install --package-lock=false --ignore-scripts --no-audit --no-fund
      - name: Record dependency install mode
        if: always()
        run: |
          set -u
          tracked_lockfile=false
          if git ls-files --error-unmatch package-lock.json >/dev/null 2>&1; then tracked_lockfile=true; fi
          {
            echo "lockfileTracked=${tracked_lockfile}"
            echo "dependencyInstallMode=$([ "$tracked_lockfile" = true ] && echo npm-ci-required || echo temporary-npm-install)"
            echo "dependencyInstallStepStatus=${{ job.status }}"
          } >> artifacts/p10-runtime/ci-transport-diagnostic.txt
      - name: Verify dependency reproducibility boundary
        run: |
          set -euxo pipefail
          if git ls-files --error-unmatch package-lock.json >/dev/null 2>&1; then
            test -f package-lock.json
            npm ci --ignore-scripts --no-audit --no-fund
            echo "lockfileInstall=npm-ci" >> artifacts/p10-runtime/ci-transport-diagnostic.txt
          else
            echo "NO_REVIEWED_LOCKFILE: temporary dependency bootstrap only; production certification remains blocked until package-lock.json is reviewed and committed."
            echo "lockfileInstall=blocked-no-reviewed-lockfile" >> artifacts/p10-runtime/ci-transport-diagnostic.txt
          fi
      - name: Verify regression manifest
        run: |
          set -euxo pipefail
          test -f scripts/p10-runtime-regression-gate.mjs
          test -f scripts/p10-evidence-integrity-gate.mjs
          node --check scripts/p10-runtime-regression-gate.mjs
          node --check scripts/p10-evidence-integrity-gate.mjs
      - name: Run deterministic P10 regression gate
        run: node scripts/p10-runtime-regression-gate.mjs
      - name: Verify P10 evidence integrity
        if: always()
        run: node scripts/p10-evidence-integrity-gate.mjs
      - name: Upload P10 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p10-runtime-evidence-${{ github.run_id }}
          path: artifacts/p10-runtime/
          if-no-files-found: error
          retention-days: 14
