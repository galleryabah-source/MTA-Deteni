name: Legacy Code Creation Provenance Audit

on:
  pull_request:
    paths:
      - "web/mta-app-runtime-full.js"
      - "web/mta-domain-commands-v1.js"
      - "web/mta-production-state-adapter-v1.js"
      - "supabase/functions/mta-api/index.ts"
      - "test/legacy-code-creation-provenance.test.mjs"
      - "docs/LEGACY_DETAINEE_CODE_CREATION_PROVENANCE_AUDIT_V1.md"
      - ".github/workflows/legacy-code-creation-provenance-audit.yml"

jobs:
  provenance-audit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --test test/legacy-code-creation-provenance.test.mjs
