name: MTA DETENI P10 Durable Mutation Contract

on:
  push:
    branches:
      - fix/p10-runtime-binding
  workflow_dispatch:

permissions:
  contents: read

jobs:
  durable-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout exact commit
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install dependencies
        run: npm install

      - name: Run durable mutation acknowledgement regression
        run: node test/p10-durable-mutation-acknowledgement.test.mjs
