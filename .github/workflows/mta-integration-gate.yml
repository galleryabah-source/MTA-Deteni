name: MTA DETENI Static Integration Gate
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate JavaScript syntax
        shell: bash
        run: |
          set -e
          find web -maxdepth 1 -type f -name '*.js' -print0 | xargs -0 -n1 node --check
      - name: Validate unified shell contract
        shell: bash
        run: |
          set -e
          checks=(
          "mta-app-runtime.js|web/index.html"
          "mta-app-runtime-full.js|web/mta-app-runtime.js"
          "mta-unified-shell-v2.js?v=8|web/mta-app-runtime-full.js"
          "mtaUnifiedResolve|web/mta-unified-shell-v2.js"
          "mta:qr-detected|web/mta-unified-shell-v2.js"
          "mtaUnifiedScannerContractTest|web/mta-unified-shell-v2.js"
          "mtaUnifiedOperationalContractTest|web/mta-unified-shell-v2.js"
          "mtaUnifiedValidateMovement|web/mta-unified-shell-v2.js"
          "mtaUnifiedValidateLeave|web/mta-unified-shell-v2.js"
          "ACTION_ENTRYPOINT|web/mta-unified-shell-v2.js"
          "INACTIVE_DETAINEE_DENY|web/mta-unified-shell-v2.js"
          "INACTIVE_ROOM_DENY|web/mta-unified-shell-v2.js"
          "INVALID_LEAVE_TRANSITION_DENY|web/mta-unified-shell-v2.js"
          "QUEUE_DERIVED_FROM_AUDIT|web/mta-unified-shell-v2.js"
          "SHARED_STATE_EVENT|web/mta-unified-shell-v2.js"
          "MONITOR_DERIVED_STATE|web/mta-unified-shell-v2.js"
          "buildOperationalQueue|web/mta-unified-shell-v2.js"
          "buildMonitorMetrics|web/mta-unified-shell-v2.js"
          "JOURNEY_AUDIT_TO_QUEUE|web/mta-unified-shell-v2.js"
          "JOURNEY_STATE_TO_MONITOR|web/mta-unified-shell-v2.js"
          "REPORT_SOURCE_SHARED_STATE|web/mta-unified-shell-v2.js"
          "REPORT_EVIDENCE_CONTRACT|web/mta-unified-shell-v2.js"
          "failureRecoveryContractTest|web/mta-unified-shell-v2.js"
          "mtaUnifiedStateConsistencyContractTest|web/mta-unified-shell-v2.js"
          "STATE_ROOT_ARRAYS|web/mta-unified-shell-v2.js"
          "AUDIT_MOVEMENT_REFERENTIAL_INTEGRITY|web/mta-unified-shell-v2.js"
          "mtaUnifiedReferentialIntegrityContractTest|web/mta-unified-shell-v2.js"
          "DETAINEE_PLACEMENT_REFERENCE|web/mta-unified-shell-v2.js"
          "PLACEMENT_DETAINEE_REFERENCE|web/mta-unified-shell-v2.js"
          "PLACEMENT_MASTER_ROOM_REFERENCE|web/mta-unified-shell-v2.js"
          "MOVEMENT_DETAINEE_REFERENCE|web/mta-unified-shell-v2.js"
          "MOVEMENT_ACTIVE_ROOM_REFERENCE|web/mta-unified-shell-v2.js"
          "LEAVE_DETAINEE_REFERENCE|web/mta-unified-shell-v2.js"
          "QR_RESOURCE_REFERENCE|web/mta-unified-shell-v2.js"
          "QR_ACTIVE_RESOURCE_STATE|web/mta-unified-shell-v2.js"
          "DOCUMENT_SOURCE_REFERENCE|web/mta-unified-shell-v2.js"
          "REPORT_EVIDENCE_REFERENCE|web/mta-unified-shell-v2.js"
          "AUDIT_RESOURCE_REFERENCE|web/mta-unified-shell-v2.js"
          "buildReferentialIntegrityReport|web/mta-unified-shell-v2.js"
          "mtaUnifiedFinalIntegrityGate|web/mta-unified-shell-v2.js"
          "SINGLE_SYNTHETIC_STATE|web/mta-unified-shell-v2.js"
          "SINGLE_MUTATION_BOUNDARY|web/mta-unified-shell-v2.js"
          "AUDIT_CHAIN_COMPLETE|web/mta-unified-shell-v2.js"
          "AUDIT_TO_MONITOR|web/mta-unified-shell-v2.js"
          "EVIDENCE_CHAIN_COMPLETE|web/mta-unified-shell-v2.js"
          "ALL_EXISTING_CONTRACTS_PASS|web/mta-unified-shell-v2.js"
          "MTA_DETENI_FINAL_INTEGRITY_GATE|web/mta-unified-shell-v2.js"
          "MOVEMENT_IDEMPOTENCY_KEYS_UNIQUE|web/mta-unified-shell-v2.js"
          "FAILURE_RECOVERY_CONTRACT|web/mta-unified-shell-v2.js"
          "requestKey|web/movement-v9.js"
          "appendAudit(d|web/movement-v9.js"
          "appendLocalAudit|web/mta-app-runtime-full.js"
          "lastMutationKey|web/mta-app-runtime-full.js"
          "lastMutation|web/movement-v9.js"
          "state=null|web/admin-settings-v9.js"
          "DETAINEE_CREATE|web/admin-settings-v9.js"
          "appendAudit(d|web/room-ops-v9.js"
          "QR_ROOM_STATE|web/room-ops-v9.js"
          "validateRuntimeState|web/mta-app-runtime-full.js"
          "BACKUP_RESTORE|web/mta-app-runtime-full.js"
          "OFFLINE_IDEMPOTENCY_KEY_REQUIRED|web/offline-queue-v1.js"
          "OFFLINE_SINGLE_ENTRY|web/offline-queue-v1.js"
          "buildReportEvidence|web/mta-app-runtime-full.js"
          "validateReportEvidence|web/mta-app-runtime-full.js"
          "REPORT_EVIDENCE_REQUIRED|web/mta-app-runtime-full.js"
          "REPORT_SOURCE_MISSING|web/mta-app-runtime-full.js"
          "buildReportEvidence|web/mta-app-runtime-full.js"
          "LEAVE_STATE_MACHINE|web/mta-unified-shell-v2.js"
          "mtaUnifiedJourneyContractTest|web/mta-unified-shell-v2.js"
          "JOURNEY_ACTIVE_DETAINEE|web/mta-unified-shell-v2.js"
          "JOURNEY_QR_ACCEPT|web/mta-unified-shell-v2.js"
          "JOURNEY_QR_TOKEN_DENY|web/mta-unified-shell-v2.js"
          "JOURNEY_QR_NOT_FOUND|web/mta-unified-shell-v2.js"
          "EXPIRED|web/mta-unified-shell-v2.js"
          "FUTURE|web/mta-unified-shell-v2.js"
          "DEPART_BEFORE_START|web/mta-unified-shell-v2.js"
          "PLACEMENT_ASSIGN_BLOCKED|web/mta-app-runtime-full.js"
          "PLACEMENT_CAPACITY_BLOCKED|web/mta-app-runtime-full.js"
          "MOVEMENT_CREATE_BLOCKED|web/mta-app-runtime-full.js"
          "mtaUnifiedValidateLeave|web/mta-unified-shell-v2.js"
          "SYNTH-QR-|web/mta-unified-shell-v2.js"
          "MTA_DETENI_QR_PRINT_ENGINE|web/qr-print-clean-v3.js"
          "mta:data-changed|web/mta-app-runtime-full.js"
          "mta:data-changed|web/movement-v9.js"
          "mta:data-changed|web/room-ops-v9.js"
          "mta:data-changed|web/admin-settings-v9.js"
          "MTA_DETENI_INTEGRATION_SELF_TEST|web/mta-unified-shell-v2.js"
          "MTAQrContext|web/mta-unified-shell-v2.js"
          "MTADeteniOfflineQueue|web/mta-unified-shell-v2.js"
          "mtaUnifiedPrintQR|web/mta-unified-shell-v2.js"
          )
          for spec in "${checks[@]}"; do
            pattern="${spec%%|*}"
            file="${spec#*|}"
            if ! grep -Fq -- "$pattern" "$file"; then
              echo "STATIC_CONTRACT_FAIL pattern=$pattern file=$file"
              exit 1
            fi
          done
          test "$(grep -c 'function detected' web/qr-camera-v2.js)" -eq 1
      - name: Enforce authentication and security contracts
        shell: bash
        run: |
          set -e
          if grep -Eq 'mtaAuth\.signUp|mtaAuthSignupMode|signUp\(email,password' web/mta-auth-ui.js; then echo "AUTH_SELF_REGISTRATION_CONTRACT_FAIL"; exit 1; fi
          grep -Fq 'SELF_REGISTRATION_DISABLED' web/mta-auth.js
          grep -Fq 'resource==="admin-users"' supabase/functions/mta-api/index.ts
          grep -Fq 'RBAC_USER_ADMIN_DENIED' supabase/functions/mta-api/index.ts
          grep -Fq 'allowedOrigin' supabase/functions/mta-api/index.ts
          grep -Fq 'mta_documents_select_authorized' supabase/migrations/20260923040000_mta_document_storage_read_hardening.sql
          grep -Fq 'mta_audit_before_insert_hash' supabase/migrations/20260923041000_mta_audit_hash_chain_v1.sql
          grep -Fq 'mta_verify_audit_integrity' supabase/migrations/20260923041000_mta_audit_hash_chain_v1.sql
          if grep -Fq '<script src="/admin-settings-v9.js' worker-v11.js; then echo "DUPLICATE_ADMIN_SETTINGS_INJECTION"; exit 1; fi
          echo "AUTH/RBAC/AUDIT/INJECTION SECURITY CONTRACT: PASS"
      - name: Enforce runtime boundaries
        shell: bash
        run: |
          set -e
          grep -q 'SYNTHETIC' web/index.html
          grep -q 'AI' web/index.html
          grep -q 'DB_DISCONNECTED' web/mta-unified-shell-v2.js
          grep -q 'MIGRATION_FREEZE' web/mta-unified-shell-v2.js
