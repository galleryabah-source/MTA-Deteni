name: MTA DETENI Static Integration Gate
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate JavaScript syntax
        shell: bash
        run: |
          set -e
          find web -maxdepth 1 -type f -name '*.js' -print0 | xargs -0 -n1 node --check
      - name: Validate unified shell contract
        shell: bash
        run: |
          set -e
          grep -q 'mta-unified-shell-v2.js?v=2' web/index.html
          grep -q 'mtaUnifiedResolve' web/mta-unified-shell-v2.js
          grep -q 'mta:qr-detected' web/mta-unified-shell-v2.js
          grep -q 'mtaUnifiedScannerContractTest' web/mta-unified-shell-v2.js
          grep -q 'mtaUnifiedOperationalContractTest' web/mta-unified-shell-v2.js
          grep -q 'mtaUnifiedValidateMovement' web/mta-unified-shell-v2.js
          grep -q 'mtaUnifiedValidateLeave' web/mta-unified-shell-v2.js
          grep -q 'ACTION_ENTRYPOINT' web/mta-unified-shell-v2.js
          grep -q 'INACTIVE_DETAINEE_DENY' web/mta-unified-shell-v2.js
          grep -q 'INACTIVE_ROOM_DENY' web/mta-unified-shell-v2.js
          grep -q 'INVALID_LEAVE_TRANSITION_DENY' web/mta-unified-shell-v2.js
          grep -q 'QUEUE_DERIVED_FROM_AUDIT' web/mta-unified-shell-v2.js
          grep -q 'SHARED_STATE_EVENT' web/mta-unified-shell-v2.js
          grep -q 'MONITOR_DERIVED_STATE' web/mta-unified-shell-v2.js
          grep -q 'buildOperationalQueue' web/mta-unified-shell-v2.js
          grep -q 'buildMonitorMetrics' web/mta-unified-shell-v2.js
          grep -q 'JOURNEY_AUDIT_TO_QUEUE' web/mta-unified-shell-v2.js
          grep -q 'JOURNEY_STATE_TO_MONITOR' web/mta-unified-shell-v2.js
          grep -q 'REPORT_SOURCE_SHARED_STATE' web/mta-unified-shell-v2.js
          grep -q 'REPORT_EVIDENCE_CONTRACT' web/mta-unified-shell-v2.js
          grep -q 'failureRecoveryContractTest' web/mta-unified-shell-v2.js
          grep -q 'mtaUnifiedStateConsistencyContractTest' web/mta-unified-shell-v2.js
          grep -q 'STATE_ROOT_ARRAYS' web/mta-unified-shell-v2.js
          grep -q 'AUDIT_MOVEMENT_REFERENTIAL_INTEGRITY' web/mta-unified-shell-v2.js
          grep -q 'mtaUnifiedReferentialIntegrityContractTest' web/mta-unified-shell-v2.js
          grep -q 'DETAINEE_PLACEMENT_REFERENCE' web/mta-unified-shell-v2.js
          grep -q 'PLACEMENT_DETAINEE_REFERENCE' web/mta-unified-shell-v2.js
          grep -q 'PLACEMENT_MASTER_ROOM_REFERENCE' web/mta-unified-shell-v2.js
          grep -q 'MOVEMENT_DETAINEE_REFERENCE' web/mta-unified-shell-v2.js
          grep -q 'MOVEMENT_ACTIVE_ROOM_REFERENCE' web/mta-unified-shell-v2.js
          grep -q 'LEAVE_DETAINEE_REFERENCE' web/mta-unified-shell-v2.js
          grep -q 'QR_RESOURCE_REFERENCE' web/mta-unified-shell-v2.js
          grep -q 'QR_ACTIVE_RESOURCE_STATE' web/mta-unified-shell-v2.js
          grep -q 'DOCUMENT_SOURCE_REFERENCE' web/mta-unified-shell-v2.js
          grep -q 'REPORT_EVIDENCE_REFERENCE' web/mta-unified-shell-v2.js
          grep -q 'AUDIT_RESOURCE_REFERENCE' web/mta-unified-shell-v2.js
          grep -q 'buildReferentialIntegrityReport' web/mta-unified-shell-v2.js
          grep -q 'MOVEMENT_IDEMPOTENCY_KEYS_UNIQUE' web/mta-unified-shell-v2.js
          grep -q 'FAILURE_RECOVERY_CONTRACT' web/mta-unified-shell-v2.js
          grep -q 'requestKey' web/movement-v9.js
          grep -q 'appendAudit(d' web/movement-v9.js
          grep -q 'appendLocalAudit' web/index.html
          grep -q 'lastMutationKey' web/index.html
          grep -q 'lastMutation' web/movement-v9.js
          grep -q 'state=null' web/admin-settings-v9.js
          grep -q 'DETAINEE_CREATE.*SUCCESS.*d' web/admin-settings-v9.js
          grep -q 'appendAudit(d' web/room-ops-v9.js
          grep -q 'QR_ROOM_STATE:' web/room-ops-v9.js
          grep -q 'validateRuntimeState' web/index.html
          grep -q 'BACKUP_RESTORE' web/index.html
          grep -q 'OFFLINE_IDEMPOTENCY_KEY_REQUIRED' web/offline-queue-v1.js
          grep -q 'OFFLINE_SINGLE_ENTRY' web/offline-queue-v1.js
          grep -q 'buildReportEvidence' web/index.html
          grep -q 'validateReportEvidence' web/index.html
          grep -q 'REPORT_EVIDENCE_REQUIRED' web/index.html
          grep -q 'REPORT_SOURCE_MISSING' web/index.html
          grep -q 'evidence:buildReportEvidence' web/index.html
          grep -q 'LEAVE_STATE_MACHINE' web/mta-unified-shell-v2.js
          grep -q 'mtaUnifiedJourneyContractTest' web/mta-unified-shell-v2.js
          grep -q 'JOURNEY_ACTIVE_DETAINEE' web/mta-unified-shell-v2.js
          grep -q 'JOURNEY_QR_ACCEPT' web/mta-unified-shell-v2.js
          grep -q 'JOURNEY_QR_TOKEN_DENY' web/mta-unified-shell-v2.js
          grep -q 'JOURNEY_QR_NOT_FOUND' web/mta-unified-shell-v2.js
          grep -q 'EXPIRED' web/mta-unified-shell-v2.js
          grep -q 'FUTURE' web/mta-unified-shell-v2.js
          grep -q 'LEAVE_DEPART_BLOCKED' web/index.html
          grep -q 'PLACEMENT_ASSIGN_BLOCKED' web/index.html
          grep -q 'PLACEMENT_CAPACITY_BLOCKED' web/index.html
          grep -q 'MOVEMENT_CREATE_BLOCKED' web/index.html
          grep -q 'mtaUnifiedValidateLeave' web/index.html
          grep -q 'SYNTH-QR-' web/mta-unified-shell-v2.js
          grep -q 'MTA_DETENI_QR_PRINT_ENGINE' web/qr-print-clean-v3.js
          grep -q 'mta:data-changed' web/index.html
          grep -q 'mta:data-changed' web/movement-v9.js
          grep -q 'mta:data-changed' web/room-ops-v9.js
          grep -q 'mta:data-changed' web/admin-settings-v9.js
          test "$(grep -c 'function detected' web/qr-camera-v2.js)" -eq 1
          grep -q 'MTA_DETENI_INTEGRATION_SELF_TEST' web/mta-unified-shell-v2.js
          grep -q 'MTAQrContext' web/mta-unified-shell-v2.js
          grep -q 'MTADeteniOfflineQueue' web/mta-unified-shell-v2.js
          grep -q 'p6printQR' web/mta-unified-shell-v2.js
      - name: Enforce runtime boundaries
        shell: bash
        run: |
          set -e
          grep -q 'SYNTHETIC' web/index.html
          grep -q 'AI' web/index.html
          grep -q 'DB_DISCONNECTED' web/mta-unified-shell-v2.js
          grep -q 'MIGRATION_FREEZE' web/mta-unified-shell-v2.js
