name: G1-X4 External Operational Credential Closure

on:
  pull_request:
    paths:
      - "docs/G1_X4_EXTERNAL_OPERATIONAL_CREDENTIAL_CLOSURE_V1.md"
      - "test/g1-x4-external-operational-credential-closure.test.mjs"
      - ".github/workflows/g1-x4-external-operational-credential-closure.yml"

jobs:
  provenance-boundary:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --test test/g1-x4-external-operational-credential-closure.test.mjs
