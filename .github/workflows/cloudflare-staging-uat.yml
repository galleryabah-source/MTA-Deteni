name: MTA DETENI Cloudflare Staging UAT Smoke

on:
  workflow_dispatch:
    inputs:
      base_url:
        description: "Cloudflare staging URL"
        required: true
        default: "https://mta-deteni-staging.galleryabah.workers.dev"

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install Playwright
        run: |
          npm init -y
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Verify staging health
        env:
          BASE_URL: ${{ inputs.base_url }}
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --max-time 15 "$BASE_URL/api/health" > health.json
          node - <<'NODE'
          const fs=require('fs');
          const x=JSON.parse(fs.readFileSync('health.json','utf8'));
          const required={
            ok:true,
            app:'MTA DETENI',
            dataMode:'SYNTHETIC_ONLY',
            productionAccessAuthorized:false,
            livePostgresqlExecution:false,
            realDetaineeDataAllowed:false,
            migrationFreeze:true
          };
          for(const [k,v] of Object.entries(required)){
            if(x[k]!==v) throw new Error(`Health invariant failed: ${k}=${JSON.stringify(x[k])}, expected ${JSON.stringify(v)}`);
          }
          console.log("STAGING HEALTH: PASS");
          NODE

      - name: Browser smoke — shell, navigation and core surfaces
        env:
          BASE_URL: ${{ inputs.base_url }}
        run: |
          cat > smoke.mjs <<'NODE'
          import { chromium } from 'playwright';
          const base=process.env.BASE_URL;
          const SUPABASE_STUB = \`
          let session = null;
          let authListener = null;
          export function createClient(){
            return {
              auth: {
                async getSession(){ return { data: { session }, error: null }; },
                onAuthStateChange(cb){
                  authListener = cb;
                  return { data: { subscription: { unsubscribe(){ if(authListener===cb) authListener=null; } } } };
                },
                async signInWithPassword({email,password}){
                  if(email !== 'synthetic@example.test' || password !== 'synthetic-password'){
                    return { data: { session: null, user: null }, error: { message: 'INVALID_SYNTHETIC_CREDENTIALS' } };
                  }
                  session = {
                    access_token: 'synthetic-browser-token',
                    user: { id: 'synthetic-browser-user', email }
                  };
                  authListener?.('SIGNED_IN', session);
                  return { data: { session, user: session.user }, error: null };
                },
                async signOut(){
                  session = null;
                  authListener?.('SIGNED_OUT', null);
                  return { error: null };
                },
                async getUser(){ return { data: { user: session?.user || null }, error: null }; }
              }
            };
          }
          \`;

          const QR_STUB = \`
          window.qrcode = window.qrcode || function(){
            return {
              addData(){},
              make(){},
              createDataURL(){ return ''; },
              createSvgTag(){ return '<svg xmlns="http://www.w3.org/2000/svg"></svg>'; }
            };
          };
          \`;

          const browser=await chromium.launch({headless:true});
          const context=await browser.newContext({
            viewport:{width:1440,height:900},
            serviceWorkers:'block'
          });
          const page=await context.newPage();
          const errors=[];
          page.on('console',m=>{if(m.type()==='error') errors.push('console:'+m.text())});
          page.on('pageerror',e=>errors.push('pageerror:'+e.message));

          await page.route('https://esm.sh/@supabase/supabase-js@2.117.1', route =>
            route.fulfill({ status:200, contentType:'application/javascript', body:SUPABASE_STUB })
          );
          await page.route('https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.js', route =>
            route.fulfill({ status:200, contentType:'application/javascript', body:QR_STUB })
          );

          await page.goto(base,{waitUntil:'domcontentloaded',timeout:30000});
          await page.screenshot({path:'staging-home.png',fullPage:true});

          const title=await page.title();
          if(!title) throw new Error('Missing document title');

          await page.locator('#mtaAuthGate.open').waitFor({state:'visible',timeout:10000});
          const locked=await page.evaluate(()=>({
            bodyLocked:document.body.classList.contains('mta-auth-locked'),
            appHidden:getComputedStyle(document.querySelector('.app')).display==='none',
            form:!!document.querySelector('#mtaAuthForm')
          }));
          if(!locked.bodyLocked || !locked.appHidden || !locked.form){
            throw new Error('Unauthenticated boundary contract failed: '+JSON.stringify(locked));
          }

          await page.locator('#mtaAuthEmail').fill('synthetic@example.test');
          await page.locator('#mtaAuthPassword').fill('synthetic-password');
          await page.locator('#mtaAuthSubmit').click();

          await page.locator('body.mta-auth-ready').waitFor({state:'attached',timeout:10000});
          await page.locator('.app').waitFor({state:'visible',timeout:10000});
          await page.getByRole('heading',{name:'Dashboard'}).first().waitFor({state:'visible',timeout:10000});

          const text=(await page.locator('body').innerText()).trim();
          if(!text) throw new Error('Empty authenticated application shell');
          const probes=['Dashboard','Dokumen','QR','Scan'];
          const found=probes.filter(x=>text.toLowerCase().includes(x.toLowerCase()));
          if(found.length<2) throw new Error('Core application surfaces not visible after synthetic authentication: '+found.join(','));
          if(errors.length) throw new Error(errors.join('\\n'));

          await browser.close();
          console.log('BROWSER SMOKE: PASS');
          NODE
          node smoke.mjs

      - name: Upload UAT evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mta-deteni-staging-uat-${{ github.run_id }}
          path: |
            health.json
            staging-home.png
          if-no-files-found: ignore
