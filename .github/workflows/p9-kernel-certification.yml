name: P9 Kernel Certification

on:
  push:
    branches: ["phase9.12-ci-certification-gate"]
  pull_request:
    branches: ["main"]

jobs:
  p9-kernel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run test:unit
      - run: node --test test/p9.12-ci-certification-gate.test.mjs
