name: G1 Final Certification Boundary

on:
  push:
    branches:
      - cert/g1-final-certification-v1
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  g1-final:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Verify G1 certification boundary
        run: node test/g1-final-certification-boundary.test.mjs
