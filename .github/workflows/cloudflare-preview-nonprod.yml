name: MTA DETENI Cloudflare Non-Production Preflight

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'wrangler.toml'
      - 'wrangler.preview.toml'
      - 'worker.js'
      - 'worker-v*.js'
      - 'web/**'
      - '.github/workflows/cloudflare-preview-nonprod.yml'

permissions:
  contents: read

env:
  DEPLOY_WORKER_NAME: mta-deteni-preview

jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install Wrangler
        run: npm install --global wrangler@4.132.0
      - name: Validate non-production artifact
        run: |
          set -euo pipefail
          test "$DEPLOY_WORKER_NAME" = "mta-deteni-preview"
          test -f wrangler.preview.toml
          test -f worker-v11.js
          test -f web/index.html
          test -f web/admin-settings-v9.js
          node --check worker-v11.js
          node --check web/admin-settings-v9.js
          cp web/mta-auth.js mta-auth-preview-check.mjs
          node --check mta-auth-preview-check.mjs
          rm -f mta-auth-preview-check.mjs
      - name: Validate Wrangler bundle without Cloudflare credentials
        run: |
          set -euo pipefail
          wrangler deploy --config wrangler.preview.toml --name "$DEPLOY_WORKER_NAME" --dry-run
          echo "Cloudflare non-production bundle preflight: PASS"
          echo "Actual preview deployment is intentionally manual from an authenticated deployment station."
