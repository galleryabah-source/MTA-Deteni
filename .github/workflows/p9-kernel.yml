name: P9 Kernel

on:
  push:
    branches: [main, phase9-kernel-implementation]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  kernel:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      APP_ENV: test
      AI_ENABLED: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --test tests/p9-kernel.test.mjs
