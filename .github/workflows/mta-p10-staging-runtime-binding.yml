name: MTA DETENI P10 Staging Runtime Binding

on:
  push:
    branches:
      - fix/p10-runtime-binding
  workflow_dispatch:

permissions:
  contents: read

env:
  DEPLOY_WORKER_NAME: mta-deteni-staging
  BASE_URL: https://mta-deteni-staging.galleryabah.workers.dev

jobs:
  bind-and-certify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout exact P10 commit
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install dependencies
        run: npm install

      - name: Install Wrangler
        run: npm install --global wrangler@4.132.0

      - name: Execute durable mutation acknowledgement regression
        run: node test/p10-durable-mutation-acknowledgement.test.mjs

      - name: Validate governed staging boundary
        run: |
          set -euo pipefail
          test -f wrangler.staging.toml
          test -f worker-v11.js
          test -f web/mta-production-api.js
          test -f web/mta-state-kernel-v1.js
          node --check worker-v11.js
          node --check test/p10-staging-runtime-binding.mjs
          node - <<'NODE'
          const fs=require('fs');
          const s=fs.readFileSync('worker-v11.js','utf8');
          const required=[
            /dataMode:\s*['"]SYNTHETIC_ONLY['"]/,
            /productionAccessAuthorized:\s*false/,
            /livePostgresqlExecution:\s*false/,
            /realDetaineeDataAllowed:\s*false/,
            /externalTransportAllowed:\s*false/,
            /durablePublicationAllowed:\s*false/,
            /migrationFreeze:\s*true/,
            /ai:\s*['"]OFF['"]/
          ];
          for(const x of required) if(!x.test(s)) throw new Error('Missing governance invariant: '+x);
          console.log('GOVERNED STAGING BOUNDARY: PASS');
          NODE

      - name: Verify Cloudflare credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          test -n "${CLOUDFLARE_API_TOKEN:-}"
          test -n "${CLOUDFLARE_ACCOUNT_ID:-}"
          export CLOUDFLARE_ACCOUNT_ID="$(printf '%s' "$CLOUDFLARE_ACCOUNT_ID" | tr -d '[:space:]')"
          printf '%s' "$CLOUDFLARE_ACCOUNT_ID" | grep -Eq '^[A-Za-z0-9_-]+$'
          CLOUDFLARE_API_TOKEN="$CLOUDFLARE_API_TOKEN" CLOUDFLARE_ACCOUNT_ID="$CLOUDFLARE_ACCOUNT_ID" wrangler whoami

      - name: Deploy exact P10 commit to staging
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          wrangler deploy --config wrangler.staging.toml --name "$DEPLOY_WORKER_NAME"

      - name: Verify staging health invariants
        run: |
          set -euo pipefail
          for i in $(seq 1 12); do
            if curl --fail --silent --show-error --max-time 10 "$BASE_URL/api/health" > staging-health.json; then break; fi
            sleep 5
          done
          test -s staging-health.json
          node - <<'NODE'
          const fs=require('fs');
          const x=JSON.parse(fs.readFileSync('staging-health.json','utf8'));
          const required={
            ok:true, app:'MTA DETENI', dataMode:'SYNTHETIC_ONLY',
            productionAccessAuthorized:false, livePostgresqlExecution:false,
            realDetaineeDataAllowed:false, externalTransportAllowed:false,
            durablePublicationAllowed:false, migrationFreeze:true, ai:'OFF'
          };
          for(const [k,v] of Object.entries(required)){
            if(x[k]!==v) throw new Error('STAGING HEALTH FAILED '+k+': '+JSON.stringify(x[k]));
          }
          console.log('STAGING HEALTH: PASS', JSON.stringify({runtime:x.runtime,version:x.version||null}));
          NODE

      - name: Install Playwright
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Execute P10 runtime binding evidence
        env:
          BASE_URL: ${{ env.BASE_URL }}
          EXPECTED_COMMIT: ${{ github.sha }}
          EVIDENCE_PATH: p10-staging-runtime-binding-evidence.json
        run: node test/p10-staging-runtime-binding.mjs

      - name: Build release-bound evidence
        if: always()
        run: |
          node - <<'NODE'
          const fs=require('fs');
          const evidence=fs.existsSync('p10-staging-runtime-binding-evidence.json')
            ? JSON.parse(fs.readFileSync('p10-staging-runtime-binding-evidence.json','utf8'))
            : null;
          const health=fs.existsSync('staging-health.json')
            ? JSON.parse(fs.readFileSync('staging-health.json','utf8'))
            : null;
          const pass=!!evidence && evidence.status==='PASS' && evidence.expectedCommit===process.env.GITHUB_SHA &&
            !!health && health.ok===true && health.dataMode==='SYNTHETIC_ONLY' &&
            health.productionAccessAuthorized===false && health.livePostgresqlExecution===false &&
            health.realDetaineeDataAllowed===false && health.migrationFreeze===true && health.ai==='OFF';
          const finalEvidence={
            certificationId:'MTA-P10-STAGING-RUNTIME-BINDING-2026-09-27-01',
            commitSha:process.env.GITHUB_SHA,
            environment:'cloudflare-production-like-staging',
            baseUrl:process.env.BASE_URL,
            deploymentTarget:process.env.DEPLOY_WORKER_NAME,
            status:pass?'CERTIFIED':'NOT_CERTIFIED',
            health,
            runtimeEvidence:evidence,
            governance:{
              syntheticOnly:true,
              productionAccessAuthorized:false,
              livePostgresqlExecution:false,
              realDetaineeDataAllowed:false,
              migrationExecuted:false,
              aiEnabled:false,
              migrationFreeze:true
            },
            timestamp:new Date().toISOString()
          };
          fs.writeFileSync('MTA-P10-STAGING-RUNTIME-BINDING-EVIDENCE.json',JSON.stringify(finalEvidence,null,2));
          if(!pass) process.exit(1);
          console.log('P10 STAGING RUNTIME BINDING: CERTIFIED');
          NODE

      - name: Upload P10 staging evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mta-p10-staging-runtime-binding-${{ github.sha }}
          path: |
            staging-health.json
            p10-staging-runtime-binding-evidence.json
            MTA-P10-STAGING-RUNTIME-BINDING-EVIDENCE.json
          if-no-files-found: error
          retention-days: 30
