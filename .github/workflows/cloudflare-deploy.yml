name: MTA DETENI Cloudflare Preview Validation

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'web/**'
      - 'worker.js'
      - 'wrangler.toml'
      - '.github/workflows/cloudflare-deploy.yml'

permissions:
  contents: read

# Governance boundary:
# This workflow validates the Cloudflare Worker configuration only.
# It MUST NOT perform a real Cloudflare deployment while Production Access
# remains NOT AUTHORIZED and no explicit controlled non-production target exists.

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install Wrangler
        run: npm install --global wrangler@4.132.0

      - name: Validate Wrangler configuration
        run: wrangler deploy --dry-run
