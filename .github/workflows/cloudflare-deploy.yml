name: MTA DETENI Cloudflare Production Deploy

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'wrangler.toml'
      - 'worker.js'
      - 'worker-*.js'
      - 'web/**'
      - '.github/workflows/cloudflare-deploy.yml'

permissions:
  contents: read
  issues: write

env:
  DEPLOY_WORKER_NAME: mta-deteni

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install Wrangler
        run: npm install --global wrangler@4.132.0

      - name: Verify production target
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          test "$DEPLOY_WORKER_NAME" = "mta-deteni"
          test -n "${CLOUDFLARE_API_TOKEN:-}"
          CF_ACCOUNT_ID="$(printf '%s' "$CLOUDFLARE_ACCOUNT_ID" | tr -d '[:space:]')"
          test -n "$CF_ACCOUNT_ID"
          case "$CF_ACCOUNT_ID" in *[!A-Za-z0-9_-]*) echo 'Cloudflare account id contains unsupported characters after whitespace normalization'; exit 1;; esac
          echo "Cloudflare target: $DEPLOY_WORKER_NAME"
          CLOUDFLARE_ACCOUNT_ID="$CF_ACCOUNT_ID" CLOUDFLARE_API_TOKEN="$CLOUDFLARE_API_TOKEN" wrangler whoami

      - name: Deploy all MTA DETENI modules
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          CF_ACCOUNT_ID="$(printf '%s' "$CLOUDFLARE_ACCOUNT_ID" | tr -d '[:space:]')"
          CF_API_TOKEN="$(printf '%s' "$CLOUDFLARE_API_TOKEN" | sed 's/[[:space:]]*$//')"
          set +e
          CLOUDFLARE_ACCOUNT_ID="$CF_ACCOUNT_ID" CLOUDFLARE_API_TOKEN="$CF_API_TOKEN" wrangler deploy --config wrangler.toml --name "$DEPLOY_WORKER_NAME" 2>&1 | tee cloudflare-deploy.log
          DEPLOY_EXIT="${PIPESTATUS[0]}"
          set -e
          if test "$DEPLOY_EXIT" -ne 0; then
            if grep -q "Uploaded $DEPLOY_WORKER_NAME" cloudflare-deploy.log; then
              echo "Wrangler returned non-zero after upload; continuing to independent runtime verification."
            else
              echo "Wrangler deployment failed before upload."
              exit "$DEPLOY_EXIT"
            fi
          fi

      - name: Verify live Cloudflare runtime
        env:
          DEPLOY_URL: https://mta-deteni.galleryabah.workers.dev
        run: |
          for i in $(seq 1 12); do
            if curl --fail --silent --show-error --max-time 10 "$DEPLOY_URL/api/health" > health.json; then
              node -e "const fs=require('fs'); const x=JSON.parse(fs.readFileSync('health.json','utf8')); if(x.ok!==true || x.app!=='MTA DETENI') process.exit(1); console.log('Cloudflare runtime health PASS:',x.app,x.runtime);"
              exit 0
            fi
            sleep 5
          done
          echo "Cloudflare runtime health verification failed."
          cat health.json 2>/dev/null || true
          exit 1

      - name: Upload Cloudflare deploy diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mta-deteni-cloudflare-deploy-${{ github.run_id }}
          path: cloudflare-deploy.log
          if-no-files-found: ignore

      - name: Publish Cloudflare failure diagnostics
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if test -s cloudflare-deploy.log; then
            gh issue create --title "CI diagnostic: Cloudflare deploy run ${{ github.run_id }}" --body-file cloudflare-deploy.log
          else
            gh issue create --title "CI diagnostic: Cloudflare deploy run ${{ github.run_id }}" --body "Cloudflare deployment failed but no deploy log file was produced."
          fi

      - name: Verify deployment artifact contract
        run: |
          test -f wrangler.toml
          test -f worker.js
          test -f worker-v11.js
          test -d web
          test -f web/index.html
          test -f web/daily-guard-report-v2.js
test -f web/daily-guard-report-d57.js
          test -f web/mobile-shell-v1.js
          test -f web/desktop-shell-v2.js
          test -f web/offline-v1.js
          test -f web/offline-queue-v1.js
          test -f web/qr-camera-v2.js
          test -f web/room-ops-v9.js
          test -f web/movement-v9.js
          test -f web/admin-settings-v9.js
          test -f web/master-room-guard-v10.js
          test -f web/preview-v10.js
          test -f web/qr-print-clean-v3.js
          echo "MTA DETENI Cloudflare artifact contract: PASS"
