name: MTA DETENI Cloudflare Preview Deploy

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'web/**'
      - 'worker.js'
      - 'wrangler.toml'
      - '.github/workflows/cloudflare-deploy.yml'

permissions:
  contents: read

# Controlled non-production boundary only.
# This workflow deploys a separate preview Worker and MUST NOT target production.

env:
  DEPLOY_TARGET: nonprod
  CLOUDFLARE_PREVIEW_NAME: mta-deteni-preview

jobs:
  deploy-preview:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install Wrangler
        run: npm install --global wrangler@4.132.0

      - name: Enforce non-production deployment boundary
        run: |
          test "$DEPLOY_TARGET" = "nonprod"
          test "$CLOUDFLARE_PREVIEW_NAME" = "mta-deteni-preview"
          echo "Deployment target: $DEPLOY_TARGET"
          echo "Worker target: $CLOUDFLARE_PREVIEW_NAME"

      - name: Validate Wrangler configuration
        run: wrangler deploy --dry-run --name "$CLOUDFLARE_PREVIEW_NAME"

      - name: Deploy controlled non-production preview
        run: wrangler deploy --name "$CLOUDFLARE_PREVIEW_NAME"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
