name: MTA DETENI Device Regression

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'web/**'
      - '.github/workflows/mta-device-regression.yml'

permissions:
  contents: read

jobs:
  browser-matrix:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        viewport:
          - { name: phone, width: 390, height: 844 }
          - { name: tablet, width: 768, height: 1024 }
          - { name: desktop, width: 1440, height: 900 }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm init -y
      - run: npm install --no-save playwright@1.55.0 http-server@14.1.1
      - run: npx playwright install --with-deps chromium
      - run: npx http-server web -p 4173 > /tmp/mta-http.log 2>&1 &
      - name: Browser smoke ${{ matrix.viewport.name }}
        env:
          WIDTH: ${{ matrix.viewport.width }}
          HEIGHT: ${{ matrix.viewport.height }}
          DEVICE: ${{ matrix.viewport.name }}
        run: |
          node <<'NODE'
          const fs=require('fs');
          const { chromium } = require('playwright');
          (async()=>{
            for(const f of ['web/offline-v1.js','web/offline-queue-v1.js','web/qr-camera-v2.js','web/qr-camera-v2.css','web/mobile-shell-v1.js']) if(!fs.existsSync(f)) throw new Error(`runtime asset missing: ${f}`);
            const browser=await chromium.launch({headless:true});
            const page=await browser.newPage({viewport:{width:Number(process.env.WIDTH),height:Number(process.env.HEIGHT)}});
            const errors=[];
            page.on('pageerror',e=>errors.push(e.message));
            await page.goto('http://127.0.0.1:4173/',{waitUntil:'networkidle'});
            await page.addScriptTag({url:'http://127.0.0.1:4173/offline-queue-v1.js'});
            await page.addScriptTag({url:'http://127.0.0.1:4173/qr-camera-v2.js'});
            await page.addScriptTag({url:'http://127.0.0.1:4173/mobile-shell-v1.js'});
            await page.waitForTimeout(150);
            const metrics=await page.evaluate(()=>({width:innerWidth,scrollWidth:document.documentElement.scrollWidth,bodyWidth:document.body.scrollWidth,queueReady:!!window.MTADeteniOfflineQueue,scannerApi:!!window.mtaQrCameraV2,mobileShell:!!document.getElementById('mtaMobileBottomNav'),mobileShellVisible:!!document.querySelector('#mtaMobileBottomNav')&&getComputedStyle(document.querySelector('#mtaMobileBottomNav')).display!=='none'}));
            if(metrics.scrollWidth>metrics.width+2 || metrics.bodyWidth>metrics.width+2) throw new Error(`horizontal overflow on ${process.env.DEVICE}: ${JSON.stringify(metrics)}`);
            if(!metrics.queueReady) throw new Error('durable queue runtime not exposed');
            if(!metrics.scannerApi) throw new Error('adaptive QR scanner API not exposed');
            if((process.env.DEVICE==='phone'||process.env.DEVICE==='tablet')&&!metrics.mobileShellVisible) throw new Error(`mobile/tablet shell not visible: ${JSON.stringify(metrics)}`);
            if(process.env.DEVICE==='phone'||process.env.DEVICE==='tablet'){
              const nav=await page.locator('#mtaMobileBottomNav').count();
              const scan=await page.locator('#mtaMobileBottomNav .mta-scan').count();
              if(nav!==1||scan!==1) throw new Error(`mobile navigation contract failed: nav=${nav} scan=${scan}`);
              await page.evaluate(()=>window.show('detainee'));
              await page.waitForTimeout(80);
              const cards=await page.locator('.mta-mobile-records .mta-mobile-record').count();
              if(cards<1) throw new Error(`mobile detainee cards missing: ${cards}`);
            }
            if(errors.length) throw new Error(`page errors: ${errors.join('; ')}`);
            console.log(JSON.stringify({device:process.env.DEVICE,metrics}));
            await browser.close();
          })();
          NODE
