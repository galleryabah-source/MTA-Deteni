name: MTA DETENI Device Regression

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'web/**'
      - '.github/workflows/mta-device-regression.yml'

permissions:
  contents: read

jobs:
  browser-matrix:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        viewport:
          - { name: phone, width: 390, height: 844 }
          - { name: tablet, width: 768, height: 1024 }
          - { name: desktop, width: 1440, height: 900 }
          - { name: desktop-hd, width: 1920, height: 1080 }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm init -y
      - run: npm install --no-save playwright@1.55.0 http-server@14.1.1
      - run: npx playwright install --with-deps chromium
      - run: npx http-server web -p 4173 > /tmp/mta-http.log 2>&1 &
      - name: Browser smoke ${{ matrix.viewport.name }}
        env:
          WIDTH: ${{ matrix.viewport.width }}
          HEIGHT: ${{ matrix.viewport.height }}
          DEVICE: ${{ matrix.viewport.name }}
        run: |
          node <<'NODE'
          const fs=require('fs');
          const { chromium } = require('playwright');
          (async()=>{
            for(const f of ['web/offline-v1.js','web/offline-queue-v1.js','web/qr-camera-v2.js','web/qr-camera-v2.css','web/preview-v5.js','web/preview-v6.js','web/preview-v10.js','web/mobile-shell-v1.js','web/desktop-shell-v2.js','web/desktop-shell-v2.css']) if(!fs.existsSync(f)) throw new Error(`runtime asset missing: ${f}`);
            const browser=await chromium.launch({headless:true});
            const page=await browser.newPage({viewport:{width:Number(process.env.WIDTH),height:Number(process.env.HEIGHT)}});
            const errors=[];
            page.on('pageerror',e=>errors.push(e.message));
            await page.goto('http://127.0.0.1:4173/',{waitUntil:'networkidle'});
            for(const s of ['offline-queue-v1.js','qr-camera-v2.js','preview-v5.js','preview-v6.js','preview-v10.js']) await page.addScriptTag({url:`http://127.0.0.1:4173/${s}`});
            await page.addStyleTag({url:'http://127.0.0.1:4173/desktop-shell-v2.css'});
            await page.addScriptTag({url:'http://127.0.0.1:4173/desktop-shell-v2.js'});
            await page.addScriptTag({url:'http://127.0.0.1:4173/mobile-shell-v1.js'});
            await page.waitForTimeout(250);
            const metrics=await page.evaluate(()=>{const side=document.querySelector('.side');const bottom=document.querySelector('#mtaMobileBottomNav');const toggle=document.querySelector('#mtaResponsiveNavToggle');return {width:innerWidth,scrollWidth:document.documentElement.scrollWidth,bodyWidth:document.body.scrollWidth,queueReady:!!window.MTADeteniOfflineQueue,scannerApi:!!window.mtaQrCameraV2,mobileShell:!!bottom,mobileShellVisible:!!bottom&&getComputedStyle(bottom).display!=='none',desktopEnhanced:document.body.classList.contains('mta-desktop-enhanced'),desktopGroupLabels:document.querySelectorAll('.mta-desktop-group-label').length,desktopStatus:!!document.querySelector('.mta-desktop-status'),sidebarVisible:!!side&&getComputedStyle(side).display!=='none',navButtons:document.querySelectorAll('#nav button[data-view]').length,collapseControl:!!toggle};});
            fs.writeFileSync(`/tmp/mta-regression-${process.env.DEVICE}.json`,JSON.stringify({device:process.env.DEVICE,metrics,errors},null,2));
            console.log('MTA_REGRESSION_METRICS '+JSON.stringify({device:process.env.DEVICE,metrics,errors}));
            if(metrics.scrollWidth>metrics.width+2 || metrics.bodyWidth>metrics.width+2) throw new Error(`horizontal overflow on ${process.env.DEVICE}: ${JSON.stringify(metrics)}`);
            if(!metrics.queueReady) throw new Error('durable queue runtime not exposed');
            if(!metrics.scannerApi) throw new Error('adaptive QR scanner API not exposed');
            if(process.env.DEVICE==='phone'||process.env.DEVICE==='tablet'){
              if(!metrics.mobileShellVisible) throw new Error(`mobile/tablet shell not visible: ${JSON.stringify(metrics)}`);
              if(metrics.desktopEnhanced) throw new Error(`desktop enhancement leaked into ${process.env.DEVICE}`);
              const nav=await page.locator('#mtaMobileBottomNav').count();
              const scan=await page.locator('#mtaMobileBottomNav .mta-scan').count();
              if(nav!==1||scan!==1) throw new Error(`mobile navigation contract failed: nav=${nav} scan=${scan}`);
              await page.evaluate(()=>window.show('detainee'));
              await page.waitForTimeout(80);
              const cards=await page.locator('.mta-mobile-records .mta-mobile-record').count();
              if(cards<1) throw new Error(`mobile detainee cards missing: ${cards}`);
            }
            if(process.env.DEVICE==='desktop'||process.env.DEVICE==='desktop-hd'){
              if(!metrics.desktopEnhanced||!metrics.sidebarVisible) throw new Error(`desktop shell contract failed: ${JSON.stringify(metrics)}`);
              if(metrics.mobileShellVisible) throw new Error(`mobile shell leaked into ${process.env.DEVICE}`);
              if(metrics.desktopGroupLabels<4) throw new Error(`desktop nav grouping incomplete: ${metrics.desktopGroupLabels}`);
              if(!metrics.desktopStatus) throw new Error('desktop runtime status strip missing');
              if(metrics.navButtons<10) throw new Error(`desktop nav buttons unexpectedly low: ${metrics.navButtons}`);
              if(!metrics.collapseControl) throw new Error('desktop nav collapse control missing');
              await page.locator('#mtaResponsiveNavToggle').click();
              await page.waitForTimeout(30);
              const collapsed=await page.locator('.side.mta-collapsed').count();
              if(collapsed!==1) throw new Error('desktop sidebar collapse contract failed');
            }
            if(errors.length) throw new Error(`page errors: ${errors.join('; ')}`);
            await browser.close();
          })();
          NODE
      - name: Upload regression diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mta-regression-${{ matrix.viewport.name }}
          path: /tmp/mta-regression-${{ matrix.viewport.name }}.json
          if-no-files-found: ignore
