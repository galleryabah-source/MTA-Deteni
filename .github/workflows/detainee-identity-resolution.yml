name: MTA DETENI Detainee Identity Resolution

on:
  push:
    branches: [main]
    paths:
      - 'web/mta-detainee-identity-resolution-v1.js'
      - 'test/detainee-identity-resolution-reentry.test.mjs'
      - 'docs/04-domain/DETAINEE-IDENTITY-RESOLUTION-REENTRY-CONTRACT-v1.0.md'
      - '.github/workflows/detainee-identity-resolution.yml'
  pull_request:
    paths:
      - 'web/mta-detainee-identity-resolution-v1.js'
      - 'test/detainee-identity-resolution-reentry.test.mjs'
      - 'docs/04-domain/DETAINEE-IDENTITY-RESOLUTION-REENTRY-CONTRACT-v1.0.md'
      - '.github/workflows/detainee-identity-resolution.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  identity-resolution:
    name: Identity Resolution & Re-entry Contract
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run deterministic identity-resolution certification
        run: node --test test/detainee-identity-resolution-reentry.test.mjs
