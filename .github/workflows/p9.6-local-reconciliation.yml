name: MTA P9.6 Local PostgreSQL Reconciliation

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - "supabase/migrations/**"
      - "scripts/p9.6-*"
      - "p9.6/**"
      - "src/application/database-adapter-contract.ts"
      - "src/infrastructure/database/p9.6-database-adapter.ts"

permissions:
  contents: read

jobs:
  p9-6-local-reconciliation:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: mta_deteni_p96
          POSTGRES_USER: mta_p96
          POSTGRES_PASSWORD: mta_p96_local_only
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U mta_p96 -d mta_deteni_p96"
          --health-interval 2s --health-timeout 3s --health-retries 20
    env:
      DATABASE_URL: postgresql://mta_p96:mta_p96_local_only@127.0.0.1:5432/mta_deteni_p96
      P9_6_ALLOW_WRITE: "false"
      CI: true
      MTA_EXECUTION_ENV: controlled-nonprod
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Verify PostgreSQL target is local
        run: |
          case "$DATABASE_URL" in *supabase.co*|*supabase.com*) echo "Production boundary violation"; exit 2;; esac
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -c "select current_database(), current_user, inet_server_addr(), inet_server_port();"
      - name: Install local Supabase compatibility objects
        run: |
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -c "do \$\$ begin if not exists (select 1 from pg_roles where rolname='anon') then create role anon noinherit nologin; end if; if not exists (select 1 from pg_roles where rolname='authenticated') then create role authenticated noinherit nologin; end if; if not exists (select 1 from pg_roles where rolname='service_role') then create role service_role noinherit nologin; end if; end \$\$;"
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f p9.6/00-local-supabase-compat.sql
      - name: Run P9.6 reconciliation engine regression tests
        run: node --test test/p9.6-reconciliation-engine.test.mjs
      - name: Run DB-001 through DB-020 negative contract gate
        run: npx tsx --test test/p9.6-db-negative-contract.test.ts
      - name: Replay repository migrations into disposable PostgreSQL
        run: |
          set -euo pipefail
          mkdir -p artifacts/p9.6
          for f in $(find supabase/migrations -maxdepth 1 -type f -name "*.sql" | sort); do
            echo "APPLYING LOCAL REPLAY: $f"
            psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f "$f"
          done
          echo LOCAL_REPLAY_SUCCESS > artifacts/p9.6/local-replay-success.txt
      - name: Run read-only PostgreSQL introspection
        run: bash scripts/p9.6-run-introspection.sh
      - name: Build expected-vs-actual reconciliation matrix
        run: node scripts/p9.6-build-reconciliation-matrix.mjs
      - name: Validate reconciliation evidence
        run: |
          test -s artifacts/p9.6/local-replay-success.txt
          test -s artifacts/p9.6/local-postgres-introspection.json
          test -s artifacts/p9.6/schema-reconciliation-matrix.json
      - name: Upload P9.6 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mta-p9.6-local-reconciliation
          path: artifacts/p9.6/
          if-no-files-found: error
          retention-days: 14
