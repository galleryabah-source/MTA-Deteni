services:
  postgres:
    image: postgres:17
    container_name: mta-deteni-p96-postgres
    restart: "no"
    environment:
      POSTGRES_DB: mta_deteni_p96
      POSTGRES_USER: mta_p96
      POSTGRES_PASSWORD: mta_p96_local_only
    ports:
      - "55432:5432"
    volumes:
      - p96_pgdata:/var/lib/postgresql/data
      - ./00-local-supabase-compat.sql:/docker-entrypoint-initdb.d/00-local-supabase-compat.sql:ro
      - ../supabase/migrations/20260921060500_mta_deteni_production_activation_foundation.sql:/docker-entrypoint-initdb.d/20260921060500_mta_deteni_production_activation_foundation.sql:ro
      - ../supabase/migrations/20260921061400_mta_production_auth_rbac_v1_2_private_helper.sql:/docker-entrypoint-initdb.d/20260921061400_mta_production_auth_rbac_v1_2_private_helper.sql:ro
      - ../supabase/migrations/20260921070000_mta_production_auth_rbac_v1.sql:/docker-entrypoint-initdb.d/20260921070000_mta_production_auth_rbac_v1.sql:ro
      - ../supabase/migrations/20260921071000_mta_production_auth_rbac_v1_1_hardening.sql:/docker-entrypoint-initdb.d/20260921071000_mta_production_auth_rbac_v1_1_hardening.sql:ro
      - ../supabase/migrations/20260923040000_mta_document_storage_read_hardening.sql:/docker-entrypoint-initdb.d/20260923040000_mta_document_storage_read_hardening.sql:ro
      - ../supabase/migrations/20260923041000_mta_audit_hash_chain_v1.sql:/docker-entrypoint-initdb.d/20260923041000_mta_audit_hash_chain_v1.sql:ro
    healthcheck:
      test: ["CMD-SHELL","pg_isready -U mta_p96 -d mta_deteni_p96"]
      interval: 2s
      timeout: 3s
      retries: 15
volumes:
  p96_pgdata:
