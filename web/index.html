<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b63ce"><meta name="description" content="MTA DETENI Digital — synthetic functional preview">
<title>MTA DETENI Digital</title>
<style>
:root{font-family:"Segoe UI",system-ui,-apple-system,BlinkMacSystemFont,sans-serif;color:#1b1b1b;background:#eef2f7;--blue:#0b63ce;--blue2:#e6f0ff;--line:#d7dce3;--card:#fff;--muted:#687385;--ok:#16763b;--warn:#8a5a00;--danger:#b42318}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:linear-gradient(135deg,#f7f9fc,#e9eef5)}button,input,select,textarea{font:inherit}button{cursor:pointer}.app{min-height:100vh;display:grid;grid-template-rows:56px 1fr 28px}.top{display:flex;align-items:center;justify-content:space-between;padding:0 16px;background:rgba(255,255,255,.9);backdrop-filter:blur(18px);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:20}.brand{display:flex;align-items:center;gap:10px}.logo{width:34px;height:34px;border-radius:9px;background:var(--blue);color:#fff;display:grid;place-items:center;font-weight:800}.brand strong{display:block;font-size:14px}.brand small{display:block;color:var(--muted);font-size:10px}.topright{display:flex;gap:8px;align-items:center}.pill{display:inline-flex;align-items:center;gap:5px;padding:5px 9px;border-radius:999px;background:#edf8f0;color:var(--ok);font-size:11px;border:1px solid #d5eedb}.layout{display:grid;grid-template-columns:240px 1fr;min-height:0}.side{padding:12px;border-right:1px solid var(--line);background:rgba(255,255,255,.74)}.nav{display:grid;gap:3px}.nav button{border:0;background:transparent;text-align:left;padding:10px 11px;border-radius:9px;color:#303640}.nav button:hover,.nav button.active{background:var(--blue2);color:#0754ae}.main{padding:20px;overflow:auto}.view{max-width:1500px;margin:auto}.hero{background:rgba(255,255,255,.9);border:1px solid var(--line);border-radius:15px;padding:20px;box-shadow:0 7px 28px rgba(30,45,65,.06)}h1{margin:0 0 5px;font-size:27px}h2{font-size:18px;margin:0 0 12px}.sub{margin:0;color:var(--muted);font-size:13px}.grid{display:grid;gap:12px}.stats{grid-template-columns:repeat(5,minmax(0,1fr));margin-top:12px}.card{background:rgba(255,255,255,.92);border:1px solid var(--line);border-radius:13px;padding:14px}.label{font-size:11px;color:var(--muted)}.value{font-size:24px;font-weight:750;margin-top:5px}.status{display:inline-block;margin-top:7px;padding:3px 7px;border-radius:999px;font-size:10px;background:#edf8f0;color:var(--ok)}.toolbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:14px 0}.btn{border:1px solid var(--line);background:#fff;padding:8px 11px;border-radius:9px}.btn:hover{background:#f4f7fb}.btn.primary{background:var(--blue);border-color:var(--blue);color:#fff}.btn.danger{color:var(--danger)}.btn.small{padding:5px 8px;font-size:11px}.tablewrap{overflow:auto;border:1px solid var(--line);border-radius:12px;background:#fff}.table{width:100%;border-collapse:collapse;min-width:760px}.table th,.table td{padding:9px 10px;border-bottom:1px solid #edf0f4;text-align:left;font-size:12px}.table th{font-size:10px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);background:#f8fafc}.empty{padding:30px;text-align:center;color:var(--muted)}.formgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.field{display:grid;gap:5px}.field label{font-size:11px;color:var(--muted)}.field input,.field select,.field textarea{border:1px solid var(--line);border-radius:8px;padding:9px;background:#fff;outline:none}.field input:focus,.field select:focus,.field textarea:focus{border-color:#6aa2e8;box-shadow:0 0 0 3px #e6f0ff}.full{grid-column:1/-1}.modal{position:fixed;inset:0;background:rgba(17,24,39,.38);display:none;align-items:center;justify-content:center;padding:16px;z-index:50}.modal.open{display:flex}.dialog{width:min(680px,100%);max-height:90vh;overflow:auto;background:#fff;border-radius:16px;padding:18px;box-shadow:0 20px 60px rgba(0,0,0,.2)}.dialoghead{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}.x{border:0;background:#f3f5f7;border-radius:50%;width:30px;height:30px}.actions{display:flex;justify-content:flex-end;gap:8px;margin-top:14px}.notice{padding:10px 12px;border-radius:10px;background:#f5f8fc;border:1px solid var(--line);font-size:12px;color:#536071}.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.timeline{display:grid;gap:8px}.event{border-left:3px solid #b7c6d9;padding:7px 10px;background:#fafbfc;border-radius:0 8px 8px 0}.event b{font-size:11px}.event small{display:block;color:var(--muted);font-size:10px;margin-top:2px}.report{background:#fff;border:1px solid #cfd5dd;padding:26px;line-height:1.45}.report .center{text-align:center}.report hr{border:0;border-top:1px solid #555;margin:16px 0}.report table{width:100%;border-collapse:collapse}.report th,.report td{border:1px solid #888;padding:7px;font-size:11px}.toast{position:fixed;right:16px;bottom:40px;background:#172033;color:#fff;padding:10px 13px;border-radius:10px;box-shadow:0 8px 30px rgba(0,0,0,.2);display:none;z-index:70;font-size:12px}.toast.show{display:block}.footer{border-top:1px solid var(--line);background:rgba(255,255,255,.8);padding:6px 14px;font-size:10px;color:var(--muted);display:flex;justify-content:space-between}.muted{color:var(--muted)}
@media(max-width:1050px){.stats{grid-template-columns:repeat(3,1fr)}}@media(max-width:760px){.layout{grid-template-columns:1fr}.side{border-right:0;border-bottom:1px solid var(--line);padding:7px;position:sticky;top:56px;z-index:15}.nav{display:flex;overflow:auto}.nav button{white-space:nowrap}.main{padding:12px}.stats{grid-template-columns:repeat(2,1fr)}.formgrid{grid-template-columns:1fr}.kpis{grid-template-columns:1fr 1fr}.top{padding:0 10px}.topright .pill{display:none}}@media(max-width:430px){.value{font-size:20px}.hero{padding:15px}h1{font-size:22px}.footer{display:none}}
@media print{body{background:#fff}.top,.side,.footer,.toolbar,.no-print{display:none!important}.main{padding:0}.hero{display:none}.report{border:0;padding:0;box-shadow:none}.app{display:block}}
<style id="mta-desktop-detainee-v1">
@media(min-width:1025px){
body.mta-desktop-enhanced .detainee-toolbar{align-items:center;gap:10px;margin:16px 0 12px}
body.mta-desktop-enhanced .detainee-toolbar>.btn.primary{min-height:40px;padding:9px 14px;font-weight:700}
body.mta-desktop-enhanced .detainee-toolbar>#dSearch{width:200px;min-height:40px;background:#fff}
body.mta-desktop-enhanced .detainee-desktop-filters{margin-left:auto;display:flex;align-items:center;gap:8px}
body.mta-desktop-enhanced .detainee-desktop-filters select{height:40px;border:1px solid #d7dce3;border-radius:9px;background:#fff;padding:0 32px 0 11px;color:#303640}
body.mta-desktop-enhanced .detainee-tablewrap{overflow:hidden;background:#fff;border-radius:14px;box-shadow:0 6px 22px rgba(15,23,42,.055)}
body.mta-desktop-enhanced .detainee-table{min-width:0}
body.mta-desktop-enhanced .detainee-table th,body.mta-desktop-enhanced .detainee-table td{padding:12px 10px;font-size:12px}
body.mta-desktop-enhanced .detainee-table th{background:#f8fafc}
body.mta-desktop-enhanced .detainee-table tbody tr:last-child td{border-bottom:0}
body.mta-desktop-enhanced .detainee-table tbody tr:hover{background:#f8fbff}
body.mta-desktop-enhanced .detainee-table th:first-child,body.mta-desktop-enhanced .detainee-table td:first-child{width:46px;text-align:center}
body.mta-desktop-enhanced .detainee-status-badge{display:inline-flex;align-items:center;padding:4px 9px;border-radius:999px;font-size:10px;font-weight:800;background:#f2f4f7;color:#667085}
body.mta-desktop-enhanced .detainee-status-badge.is-active{background:#eaf8ef;color:#16803c}
body.mta-desktop-enhanced .detainee-status-badge.is-active::before{content:"";width:6px;height:6px;border-radius:50%;background:#20a464;margin-right:5px}
body.mta-desktop-enhanced .detainee-desktop-footer{display:flex;justify-content:space-between;align-items:center;padding:13px 14px;border-top:1px solid #edf0f4;color:#526176;font-size:12px;background:#fff}
body.mta-desktop-enhanced .detainee-pagination{display:flex;gap:5px}
body.mta-desktop-enhanced .detainee-pagination .page-current{background:#0b63ce;border-color:#0b63ce;color:#fff}
}
@media(max-width:1024px){.detainee-desktop-filters,.detainee-desktop-footer{display:none!important}.detainee-tablewrap{overflow:visible}.detainee-tablewrap>.detainee-table{min-width:760px}}
</style></style>
</head>
<body>
<div class="app">
<header class="top"><div class="brand"><div class="logo">M</div><div><strong>MTA DETENI Digital</strong><small>Manajemen Terpadu Administrasi Deteni</small></div></div><div class="topright"><span class="pill">● Local synthetic runtime</span><button class="btn small" id="backupBtn">Backup</button><button class="btn small" id="importBtn">Restore</button><input id="importFile" type="file" accept="application/json" hidden></div></header>
<div class="layout"><aside class="side"><nav class="nav" id="nav"><button class="active" data-view="dashboard">Dashboard</button><button data-view="detainee">Data Deteni</button><button data-view="placement">Penempatan</button><button data-view="movement">Pergerakan</button><button data-view="leave">Izin</button><button data-view="documents">Dokumen</button><button data-view="audit">Audit Trail</button></nav></aside><main class="main"><div id="appView" class="view"></div></main></div>
<footer class="footer"><span>MTA DETENI Digital · Synthetic functional runtime · No operational detainee data</span><span id="clock"></span></footer>
</div><div id="modal" class="modal"><div class="dialog" id="dialog"></div></div><div id="toast" class="toast"></div>
<script>
const KEY='mta-deteni-demo-v2';
const seed={meta:{version:2,createdAt:new Date().toISOString()},detainees:[{id:'DET-001',code:'DET-2026-001',name:'SYNTHETIC A',nationality:'Contoh',status:'AKTIF',placement:'Blok A / Kamar 01',createdAt:'2026-09-16T07:00:00Z'},{id:'DET-002',code:'DET-2026-002',name:'SYNTHETIC B',nationality:'Contoh',status:'AKTIF',placement:'Blok B / Kamar 02',createdAt:'2026-09-16T07:10:00Z'}],placements:[{id:'PLC-001',detaineeId:'DET-001',block:'Blok A',room:'Kamar 01',since:'2026-09-16T07:20:00Z'},{id:'PLC-002',detaineeId:'DET-002',block:'Blok B',room:'Kamar 02',since:'2026-09-16T07:25:00Z'}],movements:[],leaves:[],documents:[],audit:[]};
let db=load(); let current='dashboard';
function load(){try{const x=JSON.parse(localStorage.getItem(KEY));return x&&x.detainees?x:structuredClone(seed)}catch{return structuredClone(seed)}}
function save(){localStorage.setItem(KEY,JSON.stringify(db))}
function uid(prefix){return prefix+'-'+Math.random().toString(36).slice(2,8).toUpperCase()}
function now(){return new Date().toISOString()}
function esc(v=''){return String(v).replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))}
function toast(msg){const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2200)}
function audit(action,resourceType,resourceId,result='SUCCESS'){db.audit.unshift({id:uid('AUD'),action,resourceType,resourceId:resourceId||'',result,occurredAt:now(),actor:'DEMO-OPERATOR',requestId:uid('REQ'),correlationId:uid('COR'),policyVersion:'AUTHZ-1.0'});save()}
function openModal(html){document.getElementById('dialog').innerHTML=html;document.getElementById('modal').classList.add('open')}
function closeModal(){document.getElementById('modal').classList.remove('open')}
document.getElementById('modal').addEventListener('click',e=>{if(e.target.id==='modal')closeModal()});
function statCards(){return `<section class="grid stats"><div class="card"><div class="label">Deteni Aktif</div><div class="value">${db.detainees.filter(x=>x.status==='AKTIF').length}</div><span class="status">Operational</span></div><div class="card"><div class="label">Penempatan</div><div class="value">${db.placements.length}</div><span class="status">Tracked</span></div><div class="card"><div class="label">Pergerakan</div><div class="value">${db.movements.length}</div><span class="status">Logged</span></div><div class="card"><div class="label">Izin</div><div class="value">${db.leaves.length}</div><span class="status">Workflow</span></div><div class="card"><div class="label">Audit Event</div><div class="value">${db.audit.length}</div><span class="status">Evidence</span></div></section>`}
function render(){const v=document.getElementById('appView'); if(current==='dashboard')return dashboard(v);if(current==='detainee')return detainee(v);if(current==='placement')return placement(v);if(current==='movement')return movement(v);if(current==='leave')return leave(v);if(current==='documents')return documents(v);if(current==='audit')return auditView(v)}
function shell(title,desc,body){return `<section class="hero"><h1>${title}</h1><p class="sub">${desc}</p></section>${body}`}
function dashboard(v){v.innerHTML=shell('Dashboard','Operational surface untuk menguji alur aplikasi menggunakan data sintetis.',statCards()+`<div class="grid" style="grid-template-columns:2fr 1fr;margin-top:12px"><section class="card"><h2>Alur cepat</h2><div class="toolbar"><button class="btn primary" onclick="show('detainee');addDetainee()">+ Deteni</button><button class="btn" onclick="show('placement')">Penempatan</button><button class="btn" onclick="show('movement')">Catat Pergerakan</button><button class="btn" onclick="show('leave')">Buat Izin</button><button class="btn" onclick="show('documents')">Laporan Harian</button></div><div class="notice">Runtime ini sengaja tidak memanggil database produksi. Data tersimpan persisten di browser untuk simulasi end-to-end; siap diganti adapter API/Supabase setelah governance gate database dibuka.</div></section><section class="card"><h2>Health</h2><div class="kpis"><div><div class="label">Storage</div><b>LOCAL</b></div><div><div class="label">AI</div><b>OFF</b></div><div><div class="label">Data</div><b>SYNTHETIC</b></div></div></section></div>`)}
function detainee(v){const rows=db.detainees.map(d=>`<tr><td><b>${esc(d.code)}</b></td><td>${esc(d.name)}</td><td>${esc(d.nationality)}</td><td><span class="detainee-status-badge ${d.status==='AKTIF'?'is-active':''}">${esc(d.status)}</span></td><td>${esc(d.placement||'-')}</td><td><button class="btn small" onclick="editDetainee('${d.id}')">Edit</button> <button class="btn small danger" onclick="archiveDetainee('${d.id}')">Arsip</button></td></tr>`).join('');v.innerHTML=shell('Data Deteni','Master data sintetis dengan audit event. Penghapusan permanen tidak tersedia pada demo.',`<div class="toolbar detainee-toolbar"><button class="btn primary" onclick="addDetainee()">+ Tambah Deteni</button><input id="dSearch" placeholder="Cari kode/nama" oninput="filterDetainee()" style="padding:8px;border:1px solid var(--line);border-radius:9px"><div class="detainee-desktop-filters"><select id="dStatusFilter" onchange="filterDetainee()" aria-label="Filter status"><option value="">Semua Status</option><option value="AKTIF">AKTIF</option><option value="NONAKTIF">NONAKTIF</option></select><select id="dPlacementFilter" onchange="filterDetainee()" aria-label="Filter penempatan"><option value="">Semua Penempatan</option>${[...new Set(db.detainees.map(x=>x.placement).filter(Boolean))].map(x=>`<option value="${esc(x)}">${esc(x)}</option>`).join('')}</select><button class="btn" onclick="filterDetainee()">Filter</button><button class="btn" onclick="render()">↻ Refresh</button></div></div><div class="tablewrap detainee-tablewrap"><table class="table detainee-table"><thead><tr><th>No</th><th>Kode</th><th>Nama</th><th>Kebangsaan</th><th>Status</th><th>Penempatan</th><th>Aksi</th></tr></thead><tbody id="dRows">${rows}</tbody></table><div class="detainee-desktop-footer"><span id="detaineeCount">Menampilkan ${db.detainees.length ? 1 : 0} - ${db.detainees.length} dari ${db.detainees.length} data</span><div class="detainee-pagination"><button class="btn small" disabled>‹</button><button class="btn small page-current">1</button><button class="btn small" disabled>›</button></div></div></div>`)}
function filterDetainee(){const q=document.getElementById('dSearch').value.toLowerCase();document.querySelectorAll('#dRows tr').forEach(r=>r.style.display=r.textContent.toLowerCase().includes(q)?'':'none')}
function addDetainee(existing){const d=existing||{id:'',code:'',name:'',nationality:'Contoh',status:'AKTIF',placement:''};openModal(`<div class="dialoghead"><h2>${existing?'Edit':'Tambah'} Deteni</h2><button class="x" onclick="closeModal()">×</button></div><form id="dForm" class="formgrid"><div class="field"><label>Kode</label><input name="code" required value="${esc(d.code)}" placeholder="DET-2026-003"></div><div class="field"><label>Nama (synthetic)</label><input name="name" required value="${esc(d.name)}"></div><div class="field"><label>Kebangsaan</label><input name="nationality" value="${esc(d.nationality)}"></div><div class="field"><label>Status</label><select name="status"><option ${d.status==='AKTIF'?'selected':''}>AKTIF</option><option ${d.status==='NONAKTIF'?'selected':''}>NONAKTIF</option></select></div><div class="field full"><label>Penempatan</label><input name="placement" value="${esc(d.placement)}"></div><div class="actions full"><button type="button" class="btn" onclick="closeModal()">Batal</button><button class="btn primary">Simpan</button></div></form>`);document.getElementById('dForm').onsubmit=e=>{e.preventDefault();const f=new FormData(e.target);if(existing){Object.assign(existing,{code:f.get('code'),name:f.get('name'),nationality:f.get('nationality'),status:f.get('status'),placement:f.get('placement')});audit('DETAINEE_UPDATE','DETAINEE',existing.id)}else{const x={id:uid('DET'),code:f.get('code'),name:f.get('name'),nationality:f.get('nationality'),status:f.get('status'),placement:f.get('placement'),createdAt:now()};db.detainees.unshift(x);audit('DETAINEE_CREATE','DETAINEE',x.id)}save();closeModal();render();toast('Data tersimpan')}}
function editDetainee(id){addDetainee(db.detainees.find(x=>x.id===id))}
function archiveDetainee(id){const d=db.detainees.find(x=>x.id===id);if(!d)return;d.status='NONAKTIF';audit('DETAINEE_ARCHIVE','DETAINEE',id);save();render();toast('Deteni diarsipkan')}
function placement(v){const rows=db.placements.map(p=>{const d=db.detainees.find(x=>x.id===p.detaineeId);return `<tr><td>${esc(p.id)}</td><td>${esc(d?.code||p.detaineeId)}</td><td>${esc(d?.name||'-')}</td><td>${esc(p.block)}</td><td>${esc(p.room)}</td><td>${new Date(p.since).toLocaleString('id-ID')}</td></tr>`}).join('');v.innerHTML=shell('Penempatan','Riwayat penempatan sintetis dan assignment terkini.',`<div class="toolbar"><button class="btn primary" onclick="addPlacement()">+ Assign Penempatan</button></div><div class="tablewrap"><table class="table"><thead><tr><th>ID</th><th>Kode</th><th>Nama</th><th>Blok</th><th>Kamar</th><th>Mulai</th></tr></thead><tbody>${rows||'<tr><td colspan="6" class="empty">Belum ada data</td></tr>'}</tbody></table></div>`)}
function addPlacement(){const opts=db.detainees.filter(d=>d.status==='AKTIF').map(d=>`<option value="${d.id}">${esc(d.code)} — ${esc(d.name)}</option>`).join('');openModal(`<div class="dialoghead"><h2>Assign Penempatan</h2><button class="x" onclick="closeModal()">×</button></div><form id="pForm" class="formgrid"><div class="field full"><label>Deteni</label><select name="detaineeId" required>${opts}</select></div><div class="field"><label>Blok</label><input name="block" required placeholder="Blok A"></div><div class="field"><label>Kamar</label><input name="room" required placeholder="Kamar 01"></div><div class="actions full"><button type="button" class="btn" onclick="closeModal()">Batal</button><button class="btn primary">Assign</button></div></form>`);document.getElementById('pForm').onsubmit=e=>{e.preventDefault();const f=new FormData(e.target),id=f.get('detaineeId'),p={id:uid('PLC'),detaineeId:id,block:f.get('block'),room:f.get('room'),since:now()};db.placements.unshift(p);const d=db.detainees.find(x=>x.id===id);if(d)d.placement=p.block+' / '+p.room;audit('PLACEMENT_ASSIGN','PLACEMENT',p.id);save();closeModal();render();toast('Penempatan dicatat')}}
function movement(v){const rows=db.movements.map(m=>{const d=db.detainees.find(x=>x.id===m.detaineeId);return `<tr><td>${esc(m.id)}</td><td>${esc(d?.code||m.detaineeId)}</td><td>${esc(m.type)}</td><td>${esc(m.location)}</td><td>${esc(m.note)}</td><td>${new Date(m.at).toLocaleString('id-ID')}</td></tr>`}).join('');v.innerHTML=shell('Pergerakan','Pencatatan pergerakan sintetis sebagai event operasional.',`<div class="toolbar"><button class="btn primary" onclick="addMovement()">+ Catat Pergerakan</button></div><div class="tablewrap"><table class="table"><thead><tr><th>ID</th><th>Deteni</th><th>Tipe</th><th>Lokasi</th><th>Catatan</th><th>Waktu</th></tr></thead><tbody>${rows||'<tr><td colspan="6" class="empty">Belum ada pergerakan</td></tr>'}</tbody></table></div>`)}
function addMovement(){const opts=db.detainees.filter(d=>d.status==='AKTIF').map(d=>`<option value="${d.id}">${esc(d.code)} — ${esc(d.name)}</option>`).join('');openModal(`<div class="dialoghead"><h2>Catat Pergerakan</h2><button class="x" onclick="closeModal()">×</button></div><form id="mForm" class="formgrid"><div class="field full"><label>Deteni</label><select name="detaineeId">${opts}</select></div><div class="field"><label>Tipe</label><select name="type"><option>INTERNAL</option><option>ESCORT</option><option>RETURN</option></select></div><div class="field"><label>Lokasi</label><input name="location" required placeholder="Area pemeriksaan"></div><div class="field full"><label>Catatan</label><textarea name="note" rows="3"></textarea></div><div class="actions full"><button type="button" class="btn" onclick="closeModal()">Batal</button><button class="btn primary">Catat</button></div></form>`);document.getElementById('mForm').onsubmit=e=>{e.preventDefault();const f=new FormData(e.target),m={id:uid('MOV'),detaineeId:f.get('detaineeId'),type:f.get('type'),location:f.get('location'),note:f.get('note'),at:now()};db.movements.unshift(m);audit('MOVEMENT_CREATE','MOVEMENT',m.id);save();closeModal();render();toast('Pergerakan dicatat')}}
function leave(v){const rows=db.leaves.map(l=>{const d=db.detainees.find(x=>x.id===l.detaineeId);return `<tr><td>${esc(l.id)}</td><td>${esc(d?.code||l.detaineeId)}</td><td>${esc(l.destination)}</td><td>${esc(l.status)}</td><td>${new Date(l.startAt).toLocaleString('id-ID')}</td><td>${leaveActions(l)}</td></tr>`}).join('');v.innerHTML=shell('Izin','Workflow demo dengan state transition yang tercatat ke audit trail.',`<div class="toolbar"><button class="btn primary" onclick="addLeave()">+ Buat Izin</button></div><div class="tablewrap"><table class="table"><thead><tr><th>ID</th><th>Deteni</th><th>Tujuan</th><th>Status</th><th>Mulai</th><th>Aksi</th></tr></thead><tbody>${rows||'<tr><td colspan="6" class="empty">Belum ada izin</td></tr>'}</tbody></table></div>`)}
function leaveActions(l){const map={DRAFT:'SUBMIT',SUBMITTED:'APPROVE',APPROVED:'DEPART',DEPARTED:'RETURN',RETURNED:'COMPLETE'};const next=map[l.status];return next?`<button class="btn small primary" onclick="advanceLeave('${l.id}')">${next}</button>`:'—'}
function addLeave(){const opts=db.detainees.filter(d=>d.status==='AKTIF').map(d=>`<option value="${d.id}">${esc(d.code)} — ${esc(d.name)}</option>`).join('');openModal(`<div class="dialoghead"><h2>Buat Izin</h2><button class="x" onclick="closeModal()">×</button></div><form id="lForm" class="formgrid"><div class="field full"><label>Deteni</label><select name="detaineeId">${opts}</select></div><div class="field"><label>Tujuan</label><input name="destination" required></div><div class="field"><label>Mulai</label><input name="startAt" type="datetime-local" required></div><div class="field full"><label>Keperluan</label><textarea name="purpose" rows="3"></textarea></div><div class="actions full"><button type="button" class="btn" onclick="closeModal()">Batal</button><button class="btn primary">Buat</button></div></form>`);document.getElementById('lForm').onsubmit=e=>{e.preventDefault();const f=new FormData(e.target),l={id:uid('LV'),detaineeId:f.get('detaineeId'),destination:f.get('destination'),purpose:f.get('purpose'),startAt:new Date(f.get('startAt')).toISOString(),status:'DRAFT',createdAt:now()};db.leaves.unshift(l);audit('LEAVE_CREATE','LEAVE',l.id);save();closeModal();render();toast('Izin dibuat sebagai DRAFT')}}
function advanceLeave(id){const l=db.leaves.find(x=>x.id===id);if(!l)return;const next={DRAFT:'SUBMITTED',SUBMITTED:'APPROVED',APPROVED:'DEPARTED',DEPARTED:'RETURNED',RETURNED:'COMPLETED'}[l.status];if(!next)return;l.status=next;audit('LEAVE_'+next,'LEAVE',id);save();render();toast('State izin → '+next)}
function documents(v){const rows=db.documents.map(d=>`<tr><td>${esc(d.id)}</td><td>${esc(d.type)}</td><td>${esc(d.regu)}</td><td>${esc(d.shift)}</td><td>${esc(d.date)}</td><td>${esc(d.status)}</td><td><button class="btn small" onclick="previewReport('${d.id}')">Preview</button></td></tr>`).join('');v.innerHTML=shell('Dokumen','Generator laporan harian regu jaga berbasis data terstruktur sintetis. Preview mengikuti kontrak baseline; cetak dapat disimpan sebagai PDF dari browser.',`<div class="toolbar"><button class="btn primary" onclick="generateReport()">+ Generate Laporan Harian</button></div><div class="notice">Flow: Pilih tanggal → regu → shift → validasi → preview → generate → review → final. Renderer produksi dan asset visual resmi tetap berada di gate berikutnya.</div><div class="tablewrap" style="margin-top:12px"><table class="table"><thead><tr><th>ID</th><th>Tipe</th><th>Regu</th><th>Shift</th><th>Tanggal</th><th>Status</th><th>Aksi</th></tr></thead><tbody>${rows||'<tr><td colspan="7" class="empty">Belum ada dokumen</td></tr>'}</tbody></table></div>`)}
function generateReport(){openModal(`<div class="dialoghead"><h2>Generate Laporan Harian Regu Jaga</h2><button class="x" onclick="closeModal()">×</button></div><form id="rForm" class="formgrid"><div class="field"><label>Tanggal</label><input name="date" type="date" value="${new Date().toISOString().slice(0,10)}" required></div><div class="field"><label>Regu</label><select name="regu"><option>Bravo</option><option>Alpha</option><option>Charlie</option><option>Delta</option></select></div><div class="field"><label>Shift</label><select name="shift"><option>Pagi</option><option>Siang</option><option>Malam</option></select></div><div class="field"><label>Waktu</label><input name="time" value="07.00–14.00 WIB"></div><div class="field full"><label>Catatan handover</label><textarea name="note" rows="3">Seluruh data pada preview ini bersifat sintetis.</textarea></div><div class="actions full"><button type="button" class="btn" onclick="closeModal()">Batal</button><button class="btn primary">Validasi & Generate</button></div></form>`);document.getElementById('rForm').onsubmit=e=>{e.preventDefault();const f=new FormData(e.target),r={id:uid('RPT'),type:'DAILY_GUARD_REPORT',regu:f.get('regu'),shift:f.get('shift'),date:f.get('date'),time:f.get('time'),note:f.get('note'),status:'GENERATED',templateVersion:'DAILY-GUARD-v1.0',generatedAt:now(),integrityHash:crypto.randomUUID()};db.documents.unshift(r);audit('DOCUMENT_GENERATE','DOCUMENT',r.id);save();closeModal();render();previewReport(r.id)}}
function reportHtml(r){const active=db.detainees.filter(d=>d.status==='AKTIF');const leaveCount=db.leaves.filter(l=>l.status==='DEPARTED'||l.status==='RETURNED').length;return `<div class="report"><div class="center"><b>PEMERINTAH REPUBLIK INDONESIA</b><br><b>MTA DETENI DIGITAL</b><h2>LAPORAN HARIAN REGU JAGA</h2><p>Regu ${esc(r.regu)} · Shift ${esc(r.shift)} · ${esc(r.date)} · ${esc(r.time)}</p></div><hr><h3>1. COVER / IDENTITAS LAPORAN</h3><p>Dokumen: <b>${esc(r.id)}</b><br>Template: ${esc(r.templateVersion)}<br>Status: ${esc(r.status)}</p><h3>2. ADDRESSEE</h3><p>Kepada pejabat/pengawas yang berwenang sesuai matriks otorisasi.</p><h3>3. TEAM HANDOVER</h3><p>Handover: ${esc(r.note)}. Data anggota dan kehadiran harus berasal dari master duty pada renderer produksi.</p><h3>4. DETAINEE BLOCK CHECKING / CONTROL</h3><table><tr><th>Indikator</th><th>Nilai sintetis</th></tr><tr><td>Deteni aktif</td><td>${active.length}</td></tr><tr><td>Pergerakan tercatat</td><td>${db.movements.length}</td></tr><tr><td>Catatan izin aktif/terkait</td><td>${leaveCount}</td></tr></table><h3>5. GUARD-POST READINESS</h3><p>Kondisi post/CCTV: synthetic verification — tidak mewakili kondisi operasional.</p><h3>6. DETAINEE ACTIVITY SUPERVISION</h3><p>Aktivitas dan hasil harus diisi dari activity record terverifikasi.</p><h3>7. SPECIAL ESCORT / ACTIVITY</h3><p>${db.movements.filter(m=>m.type==='ESCORT').length} event escort sintetis tercatat.</p><h3>8. MEAL DISTRIBUTION / SCHEDULED SERVICE</h3><p>Section placeholder terkontrol; data operasional belum digunakan.</p><h3>9. END-OF-SHIFT HANDOVER</h3><p>End handover mengikuti regu/shift dan state workflow yang tervalidasi.</p><h3>10. CLOSING & SIGNATURES</h3><p>Pejabat penandatangan harus berasal dari master data berwenang. Sistem tidak memalsukan tanda tangan.</p><h3>11. CLOSING PAGE</h3><p class="center">Dokumen sintetis — bukan laporan operasional.</p><hr><small>Integrity reference: ${esc(r.integrityHash)} · Generated ${new Date(r.generatedAt).toLocaleString('id-ID')}</small></div>`}
function previewReport(id){const r=db.documents.find(x=>x.id===id);if(!r)return;openModal(`<div class="dialoghead no-print"><h2>Preview — ${esc(r.id)}</h2><button class="x" onclick="closeModal()">×</button></div><div class="toolbar no-print"><button class="btn primary" onclick="window.print()">Cetak / Simpan PDF</button><button class="btn" onclick="finalizeReport('${r.id}')">Finalisasi</button></div>${reportHtml(r)}`);audit('DOCUMENT_PREVIEW','DOCUMENT',id)}
function finalizeReport(id){const r=db.documents.find(x=>x.id===id);if(!r)return;r.status='FINAL';audit('DOCUMENT_ISSUE','DOCUMENT',id);save();closeModal();render();toast('Dokumen difinalisasi')}
function auditView(v){const rows=db.audit.map(a=>`<div class="event"><b>${esc(a.action)}</b> · ${esc(a.result)} · ${esc(a.resourceType)} ${esc(a.resourceId)}<small>${new Date(a.occurredAt).toLocaleString('id-ID')} · actor ${esc(a.actor)} · request ${esc(a.requestId)}</small></div>`).join('');v.innerHTML=shell('Audit Trail','Evidence lokal sintetis untuk setiap tindakan material pada demo runtime.',`<div class="toolbar"><button class="btn" onclick="verifyAudit()">Verifikasi Chain</button><button class="btn" onclick="clearDemo()">Reset Demo</button></div><div class="timeline">${rows||'<div class="empty">Belum ada event audit</div>'}</div>`)}
function verifyAudit(){toast('Audit demo valid secara event policy; hash-chain produksi menunggu kernel adapter')}
function clearDemo(){if(confirm('Reset seluruh data synthetic demo?')){db=structuredClone(seed);save();render();toast('Demo direset')}}
function show(v){current=v;document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('active',b.dataset.view===v));render()}
document.getElementById('nav').addEventListener('click',e=>{const b=e.target.closest('button');if(b)show(b.dataset.view)});
document.getElementById('backupBtn').onclick=()=>{const blob=new Blob([JSON.stringify(db,null,2)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='mta-deteni-synthetic-backup.json';a.click();audit('EXPORT_DOWNLOAD','BACKUP','synthetic');toast('Backup JSON dibuat')};
document.getElementById('importBtn').onclick=()=>document.getElementById('importFile').click();
document.getElementById('importFile').onchange=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{const x=JSON.parse(r.result);if(!x.detainees||!x.audit)throw new Error('format');db=x;save();audit('BACKUP_RESTORE','BACKUP','synthetic');render();toast('Backup dipulihkan')}catch{toast('Backup tidak valid')}};r.readAsText(f)};
setInterval(()=>document.getElementById('clock').textContent=new Date().toLocaleString('id-ID'),1000);render();
</script></body></html>
